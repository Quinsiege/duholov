  <script>
  'use strict';
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, err: e.message }); }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'условие не выполнено'); }
  function eq(a, b, msg) { if (a !== b) throw new Error(`${msg || ''} ожидалось ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`); }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > eps) throw new Error(`${msg || ''} ${a} ≉ ${b}`); }
  const pending = [];
  function atest(name, fn) { pending.push({ name, fn }); }

  // Игра в памяти: ничего не пишем в localStorage
  S.save = () => {};
  Bus.emit = () => {};
  UI.toast = () => {};
  Friends.sync = () => {}; // без обращений к серверу
  Game.on = () => false;
  S.newGame('Тест', 'ugolek');
  S.d.level = 12;
  MapView.pos = { lat: 55.75, lng: 37.62 };
  const fresh = (sid, lvl = 10) => { const sp = S.makeSpirit(sid, lvl, 'seed' + sid + lvl); S.d.spirits.push(sp); return sp; };
  // 5.2: места спят и просыпаются по неделям (W.awake). Тесты других правил берут места с произвольными id — для них все места
  // бодрствуют; сами недели проверяют тесты «Места 5.2» с настоящим правилом (withSleep)
  const W_AWAKE = W.awake;
  W.awake = () => true;
  const withSleep = fn => { W.awake = W_AWAKE; try { return fn(); } finally { W.awake = () => true; } };
  const withSleepA = async fn => { W.awake = W_AWAKE; try { return await fn(); } finally { W.awake = () => true; } };

  /* ---------- данные ---------- */
  // 4.15: языки — перевод по русскому ключу, подстановки, ошибки сервера по шаблону, формы числа, без словаря — русский
  test('Языки: ru`…`, I18N.back и формы числа', () => {
    eq(I18N.lang, 'ru', 'тесты идут на русском');
    eq(ru`Сила ${5}`, 'Сила 5');
    const was = { dict: I18N.dict, lang: I18N.lang, pats: I18N._pats };
    try {
      I18N.dict = { 'Сила {0}': 'Power {0}', 'Нужна команда': 'Team needed', '{0} ускользнул': '{0} got away', 'Уголёк': 'Ugolyok', 'Дань с {0} Святилищ': '{0} tribute' };
      I18N._pats = null; I18N.lang = 'en';
      eq(ru`Сила ${7}`, 'Power 7');
      eq(ru('Нужна команда'), 'Team needed');
      eq(ru`Нет такого`, 'Нет такого', 'нет перевода — русский');
      eq(I18N.back('Нужна команда'), 'Team needed', 'ошибка сервера — точное совпадение');
      eq(I18N.back('Уголёк ускользнул'), 'Ugolyok got away', 'по шаблону, подстановка тоже переводится');
      eq(I18N.back('Совсем другое'), 'Совсем другое');
      eq(U.plural(1, 'a', 'b', 'c'), 'a'); eq(U.plural(3, 'a', 'b', 'c'), 'c'); eq(U.plural(21, 'a', 'b', 'c'), 'c');
      I18N.lang = 'ja'; eq(U.plural(1, 'a', 'b', 'c'), 'c');
      I18N.lang = 'fr'; eq(U.plural(0, 'a', 'b', 'c'), 'a');
    } finally { I18N.dict = was.dict; I18N.lang = was.lang; I18N._pats = was.pats; }
    eq(U.plural(3, 'a', 'b', 'c'), 'b', 'русские формы');
    eq(U.plural(21, 'a', 'b', 'c'), 'a');
  });
  test('У каждого духа уникальный id и корректные ссылки', () => {
    const ids = new Set();
    SPECIES.forEach(s => {
      ok(!ids.has(s.id), 'повтор ' + s.id); ids.add(s.id);
      ok(ELEMENTS[s.el], 'стихия ' + s.id);
      ok(SP[s.fam], 'семья ' + s.id);
      if (s.evo) { ok(SP[s.evo], 'превращение ' + s.id); ok(SP[s.evo].fam === s.fam, 'семья превращения ' + s.id); ok(s.cost > 0, 'цена ' + s.id); }
      ok(s.base.length === 3 && s.base.every(v => v > 50), 'статы ' + s.id);
      ok(RARITY[s.rar], 'редкость ' + s.id);
    });
  });
  test('Каждая стихия сильна против двух и слаба против двух', () => {
    ELEMENT_KEYS.forEach(e => {
      eq(ELEMENTS[e].beats.length, 2, e);
      eq(ELEMENT_KEYS.filter(x => ELEMENTS[x].beats.includes(e)).length, 2, e);
      ELEMENTS[e].beats.forEach(b => ok(!ELEMENTS[b].beats.includes(e), `взаимная сила ${e}/${b}`));
    });
  });
  test('Графика: все духи рисуются (обычные, сияющие, омрачённые) без NaN/undefined', () => {
    SPECIES.forEach(s => [[false, false], [true, false], [false, true]].forEach(([sh, dk]) => {
      const svg = Art.svgOf({ sid: s.id, shiny: sh, dark: dk }); // сам рисунок; наружу духи отдаются слоями (Art.spirit → Art.stack)
      ok(svg.startsWith('<svg'), s.id);
      ok(!/NaN|undefined/.test(svg), `${s.id}${sh ? ' сияющий' : ''}${dk ? ' омрачённый' : ''}`);
    }));
    ok(Art.img('ugolek').startsWith('<img'), 'Art.img');
    // 4.17: дух — стикер: лицевая сторона (картинка или слои SVG) и обратная — основа по силуэту
    const stk = Art.spirit('kapelka');
    ok(stk.startsWith('<span class="art sp-sticker'), 'Art.spirit — стикер');
    ok(stk.includes('<span class="stc-front"><span class="art-stack') && !stk.includes('stc-front"><span class="art '), 'лицевая сторона — слоями и без класса .art');
    ok(stk.includes('class="stc-glue" style="-webkit-mask-image:url(' + "'data:image/svg+xml"), 'обратная сторона — по силуэту рисунка');
    ok(stk.includes('class="stc-liner"') && stk.includes('class="stc-flap"'), 'обратная сторона — плёнка с отогнутым углом');
    AMULET_KEYS.forEach(k => ok(!/NaN|undefined/.test(Art.amulet(k)), 'амулет ' + k));
  });
  test('Опыт до следующего уровня растёт на всех 40 уровнях', () => {
    for (let l = 2; l <= MAX_LEVEL; l++) ok(levelXP(l) > levelXP(l - 1), 'уровень ' + l);
  });

  /* ---------- утилиты и мир ---------- */
  test('Хеш детерминирован и лежит в [0, 1)', () => {
    eq(U.h('a', 1, 2), U.h('a', 1, 2));
    ok(U.h('a', 1, 2) !== U.h('a', 2, 1));
    for (let i = 0; i < 500; i++) { const v = U.h('x', i); ok(v >= 0 && v < 1, 'значение ' + v); }
    const r1 = U.rng('s'), r2 = U.rng('s');
    for (let i = 0; i < 10; i++) eq(r1(), r2());
  });
  test('Расстояние: 1° широты ≈ 111 км', () => near(U.dist(55, 37, 56, 37), 111195, 300));
  test('Духи на карте детерминированы и лежат в радиусе', () => {
    const a = W.spawnsAround(55.75, 37.62, 300), b = W.spawnsAround(55.75, 37.62, 300);
    eq(JSON.stringify(a.map(x => x.id + x.sid)), JSON.stringify(b.map(x => x.id + x.sid)));
    ok(a.length > 0, 'духов нет');
    a.forEach(x => { ok(x.d <= 300, 'радиус'); ok(SP[x.sid] && !SP[x.sid].legend, 'вид ' + x.sid); ok(x.lvl >= 1 && x.lvl <= 40, 'уровень'); });
  });
  test('Пойманный дух не выше уровня Ловчего (4.15)', () => {
    const lv = S.d.level;
    try {
      S.d.level = 3; eq(S.catchLvl(), 3);
      const a = W.spawnsAround(55.75, 37.62, 600); ok(a.length > 0, 'духов нет');
      a.forEach(x => ok(x.lvl >= 1 && x.lvl <= 3, 'уровень ' + x.lvl + ' выше уровня Ловчего'));
      S.d.level = 1; eq(S.catchLvl(), 1);
      W.spawnsAround(55.75, 37.62, 600).forEach(x => eq(x.lvl, 1, 'на 1-м уровне — духи 1-го уровня'));
    } finally { S.d.level = lv; }
  });
  test('Здоровье духов: раны, восстановление, без сил, лечение (4.15)', () => {
    const sp = { uid: 'hp1', sid: SPECIES[0].id, lvl: 5, iv: [5, 5, 5] }, t0 = 1e12, H = Rules.HP;
    eq(S.hpNow(sp, t0), 1, 'новый дух здоров');
    S.setHp(sp, 0.4, t0); near(S.hpNow(sp, t0), 0.4, 1e-9); near(S.hpNow(sp, t0 + 3600000), 0.4 + H.REGEN, 1e-9, 'сам восстанавливается');
    eq(S.hpNow(sp, t0 + 100 * 3600000), 1, 'не выше полного');
    S.setHp(sp, 0, t0); eq(S.hpNow(sp, t0 + 1000), 0, 'без сил'); ok(!S.alive(sp) || S.hpNow(sp) > 0);
    const ko = Rules.koMs(sp); eq(ko, H.KO_H[SPECIES[0].rar] * 3600000, 'срок — по редкости');
    eq(S.hpNow(sp, t0 + ko - 1), 0); eq(S.hpNow(sp, t0 + ko), H.BACK, 'поднимается сам на 10%');
    ok(Rules.koMs({ sid: 'koschey' }) === 24 * 3600000 && Rules.koMs({ sid: 'ugolek' }) === 2 * 3600000, 'от 2 до 24 часов');
    S.setHp(sp, 1, t0); ok(!('hpf' in sp) && !('ko' in sp), 'здоровый — без лишних полей');
  });
  test('Регионы (4.28): вещие птицы — славянские духи, водятся на славянской родине (5.1.26)', () => {
    eq(W.region(37), 'west'); eq(W.region(60), 'center'); eq(W.region(130), 'east');
    ok(W.home(SP.sirin, 55.75, 37.62) && W.home(SP.sirin, 55.03, 82.92) && !W.home(SP.sirin, 40.71, -74), 'Сирин — в Москве и Новосибирске, не в Нью-Йорке');
    ok(W.home(SP.gamayun, 43.12, 131.89) && !W.home(SP.gamayun, 35.68, 139.69), 'Гамаюн — во Владивостоке, не в Токио');
    ok(W.home(SP.ugolek, 55.75, 37.62) && !W.home(SP.ugolek, 37.98, 23.73), 'Уголёк — дома, не в Афинах');
  });
  // Реальные объекты: подкладываем набор «с сервера»
  const fakePois = [];
  for (let i = 0; i < 60; i++) {
    const id = 'osm:n' + (1000 + i);
    fakePois.push({ id, name: 'Объект ' + i, kind: i % 3 ? 'spring' : 'shrine', lat: 55.75 + (U.h('la', i) - 0.5) * 0.02, lng: 37.62 + (U.h('ln', i) - 0.5) * 0.03, photo: i === 1 ? 'u/p.jpg' : null });
  }
  fakePois.forEach(p => { p.t = Poi.tileId(p.lat, p.lng); Poi.list.set(p.id, p); });
  test('Источники, разломы и святилища стоят у реальных объектов', () => {
    const sp = W.springsAround(55.75, 37.62, 2000);
    ok(sp.length > 0, 'источники');
    ok(sp.every(s => Poi.list.get(s.id) && Poi.list.get(s.id).kind === 'spring'), 'источник = объект типа «источник»');
    const rf = W.riftsAround(55.75, 37.62, 3000), sh = W.shrinesAround(55.75, 37.62, 3000);
    ok(rf.every(r => SP[r.boss] && r.tier >= 1 && r.tier <= 3 && r.place), 'разломы');
    ok(sh.length > 0, 'святилища');
    const shrines = fakePois.filter(p => p.kind === 'shrine' && U.dist(55.75, 37.62, p.lat, p.lng) <= 3000).length;
    eq(rf.length + sh.length, shrines, 'разлом открывается вместо святилища');
    ok(!sh.some(s => rf.some(r => r.id.startsWith(s.id + ':'))), 'святилище с разломом скрыто');
    const g = W.guardian(sh[0]);
    eq(g.team.length, 3, 'команда хранителя');
    ok(g.team.every(x => !SP[x.sid].legend && !SP[x.sid].region), 'без легенд и региональных');
  });
  // 5.2: каждую неделю бодрствует ~40% мест (Rules.PLACES.SHARE), на следующей — другие; места игроков не спят, новичку — все Источники
  test('Места 5.2: бодрствует ≈40%, каждую неделю — другие', () => withSleep(() => {
    const tut = S.d.tut; S.d.tut = 0;
    try {
      eq(Rules.PLACES.SHARE, 0.4); eq(Rules.PLACES.VIEW, 200);
      const ids = Array.from({ length: 5000 }, (_, i) => ({ id: 'osm:n' + (300000 + i) }));
      const w0 = Ev.week(), t = k => ((w0 + k) * 7 - 3) * 86400000 + 3600000; // час после начала недели w0 + k
      const on = [0, 1, 2, 3, 4, 5].map(k => new Set(ids.filter(p => W.awake(p, 'spring', t(k))).map(p => p.id)));
      on.forEach((s, k) => near(s.size / ids.length, 0.4, 0.03, `неделя +${k}:`));
      for (let k = 0; k < 5; k++) eq([...on[k]].filter(id => on[k + 1].has(id)).length, 0, `недели +${k} и +${k + 1} — разные места`);
      ok(ids.every(p => [0, 1, 2, 3, 4].filter(k => on[k].has(p.id)).length === 2), 'каждое место — две недели из пяти');
      // граница недели — как у событий недели (Ev.week: понедельник 00:00 UTC)
      const edge = (w0 + 1) * 7 - 3, p = ids.find(x => on[0].has(x.id));
      ok(W.awake(p, 'shrine', edge * 86400000 - 1) && !W.awake(p, 'shrine', edge * 86400000), 'засыпает ровно в понедельник 00:00 UTC');
      ok(ids.slice(0, 50).every(x => W.awake(x, 'spring', t(0)) === W.awake(x, 'shrine', t(0))), 'правило одно для Источника и Святилища');
      ok([0, 1, 2, 3, 4].every(k => W.awake({ id: 'usr:00000000-0000-0000-0000-000000000001' }, 'shrine', t(k))), 'место игрока не спит');
      const sleeping = ids.find(x => !on[0].has(x.id));
      S.d.tut = 3;
      ok(W.awake(sleeping, 'spring', t(0)), 'новичку на обучении — все Источники');
      ok(!W.awake(sleeping, 'shrine', t(0)), 'Святилища у новичка — как у всех');
      S.d.tut = 0;
      // на карте и в списках — только бодрствующие; у спящего Святилища нет ни Святилища, ни Разлома (и Великого — тоже)
      const hour = Math.floor(U.now() / 3600000), aw = x => W.awake(x, x.kind);
      const sp = W.springsAround(55.75, 37.62, 3000), in3 = x => U.dist(55.75, 37.62, x.lat, x.lng) <= 3000;
      eq(sp.length, fakePois.filter(x => x.kind === 'spring' && in3(x) && aw(x)).length, 'Источники — только бодрствующие');
      ok(sp.length < fakePois.filter(x => x.kind === 'spring' && in3(x)).length, 'часть Источников спит');
      const rf = W.riftsAround(55.75, 37.62, 3000), sh = W.shrinesAround(55.75, 37.62, 3000);
      eq(rf.length + sh.length, fakePois.filter(x => x.kind === 'shrine' && in3(x) && aw(x)).length, 'Святилища и Разломы — только у бодрствующих');
      const zz = fakePois.find(x => x.kind === 'shrine' && !aw(x)), rr = W.riftAt;
      W.riftAt = () => true;
      try { eq(W.riftFor(zz, 0, hour), null, 'у спящего места Разлома нет'); ok(W.riftFor(fakePois.find(x => x.kind === 'shrine' && aw(x)), 0, hour), 'у бодрствующего — есть'); }
      finally { W.riftAt = rr; }
    } finally { S.d.tut = tut; }
  }));
  test('Квадраты карты и поиск объектов рядом', () => {
    eq(Poi.tileId(55.7515, 37.6195), '3761:5575');
    eq(Poi.tileId(-33.875, 151.215), '15121:-3388', 'южное и восточное полушарие');
    const t = Poi.tilesAround(55.75, 37.62, Poi.LOAD_R);
    ok(t.length >= 4 && t.length <= 30, 'квадратов вокруг: ' + t.length);
    ok(t.some(([x, y]) => `${x}:${y}` === Poi.tileId(55.75, 37.62)), 'свой квадрат');
    const n = Poi.near(55.75, 37.62, 500);
    ok(n.every(p => p.d <= 500), 'радиус');

  const fakeMapView = (feats, delay = () => 0) => {
    const Z = 15, N = 2 ** Z, byTile = new Map();

      const X = (f.lng + 180) / 360 * N, r = f.lat * Math.PI / 180, Y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * N;
      const k = Math.floor(X) + ':' + Math.floor(Y);
      if (!byTile.has(k)) byTile.set(k, []);
      byTile.get(k).push({ id: f.id, geomType: 1, geom: [[{ x: (X - Math.floor(X)) * 512, y: (Y - Math.floor(Y)) * 512 }]], props: f.props });
    });
    return { tileCache: { get: ({ x, y }) => new Promise(res => setTimeout(() => res(new Map([['pois', byTile.get(x + ':' + y) || []]])), delay(x, y))) } };
  };

    // перезарядка (как в Pokémon GO): км → минуты, между строками — плавно; дрожь GPS (меньше 1 км) не в счёт
    eq(Rules.jumpCool(0.5), 0, 'ближе 1 км — не в счёт'); eq(Rules.jumpCool(1), 1); eq(Rules.jumpCool(10), 6); eq(Rules.jumpCool(500), 60); eq(Rules.jumpCool(1000), 100);
    eq(Rules.jumpCool(1001), 120, 'дальше 1000 км — 2 часа'); near(Rules.jumpCool(7.5), 4, 1e-9, 'между 5 и 10 км — плавно');
    ok(Rules.JUMP.T.every((r, i, T) => !i || (r[0] > T[i - 1][0] && r[1] >= T[i - 1][1])), 'таблица по возрастанию');
    const now = Date.now(), a = { lat: 55.75, lng: 37.62, t: now }, far = { lat: 56.65, lng: 37.62 }, km = U.dist(a.lat, a.lng, far.lat, far.lng) / 1000;
    near(Rules.jumpWait(a, far, now) / 60000, Rules.jumpCool(km), 1e-6, 'сразу после прыжка — вся перезарядка');
    near(Rules.jumpWait({ ...a, t: now - 10 * 60000 }, far, now) / 60000, Rules.jumpCool(km) - 10, 1e-6, 'прошедшее время — в зачёт');

    eq(Rules.jumpWait(a, { lat: 55.7501, lng: 37.62 }, now), 0, 'рядом — без перезарядки'); eq(Rules.jumpWait(null, far, now), 0, 'первое действие');
    // путь: точка — не дальше, чем можно пробежать от позиции, где сервер видел Ловчего
    const ref = { lat: 55.75, lng: 37.62, t: now, acc: 10 };
    ok(Rules.trackNear({ lat: 55.7515, lng: 37.62, t: now }, ref), '170 м — в пределах TRACK.MIN');
    ok(!Rules.trackNear({ lat: 55.76, lng: 37.62, t: now - 30000 }, ref), '1,1 км за 30 с — нет');

    // нижняя граница ран: недостающее снимается с бойцов по порядку; больше ран от телефона — верим телефону

  const sfxCalls = src => {
    const names = [], dyn = [];
    for (let i = src.indexOf('Sfx.play('); i >= 0; i = src.indexOf('Sfx.play(', i + 1)) {
      let depth = 1, q = null, end = -1;
      for (let j = i + 9; j < src.length && end < 0; j++) {
        const c = src[j];
        if (q) { if (c === '\\') j++; else if (c === q) q = null; continue; }
        if (c === "'" || c === '"' || c === '`') q = c;
        else if ('([{'.includes(c)) depth++;
        else if (')]}'.includes(c)) { if (--depth === 0) end = j; }
        else if (c === ',' && depth === 1) end = j; // второй аргумент — параметры, не имя
      }
      const arg = src.slice(i + 9, end), alt = arg.includes('?') ? arg.slice(arg.indexOf('?') + 1) : arg; // условие — не имя
      const lits = [...alt.matchAll(/'([^']+)'/g)].map(m => m[1]);
      if (lits.length) names.push(...lits); else dyn.push(arg.trim());
    }
    return { names, dyn };
  };

    const sq = (x0, y0, x1, y1, H) => ({ b: { g: [[{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }]], H, b: [x0, y0, x1, y1] }, ox: 0, oy: 0, s: 1 });
    const hides = (c, base) => Bld3D.hides(c, 0, 0, cam, 1, base || 0); // фигура — в точке (0, 0)
    ok(hides(sq(-20, 20, 20, 60, 40)), 'дом в 20 точках перед фигурой — заслоняет');
    ok(!hides(sq(-20, -60, 20, -20, 40)), 'дом позади фигуры — нет');
    ok(!hides(sq(200, 20, 240, 60, 40)), 'сбоку — нет');
    ok(!hides(sq(-20, 20, 20, 60, 2)), 'низкий забор — нет');
    ok(!hides(sq(-20, 400, 20, 440, 40)), 'невысокий дом далеко впереди — луч проходит над ним');
    ok(hides(sq(-20, 400, 20, 440, 500)), 'а высокий — заслоняет');
    ok(hides(sq(-10, -10, 10, 10, 30)), 'фигура в самом доме — заслоняет');
    ok(!hides(sq(-10, -10, 10, 10, 30), 30), 'место на крыше этого дома — нет');
    const ring = { b: { g: [[{ x: -30, y: -30 }, { x: 30, y: -30 }, { x: 30, y: 30 }, { x: -30, y: 30 }], [{ x: -10, y: -10 }, { x: 10, y: -10 }, { x: 10, y: 10 }, { x: -10, y: 10 }]], H: 40, b: [-30, -30, 30, 30] }, ox: 0, oy: 0, s: 1 };
    ok(hides(ring), 'во дворе дома — заслоняет ближняя к игроку его часть');
    // дом у края плитки — в обеих плитках (у каждой — своя часть): прозрачными — обе
    const keepT = Bld3D.tiles, keepG = Bld3D.gen;
    try {
      Bld3D.tiles = new Map();
      const tile = (x, y) => { const t = { x, y, st: 'ok', bs: [], ix: new Array(Bld3D.OG * Bld3D.OG), hi: 0 }; Bld3D.tiles.set(x + ':' + y, t); return t; };
      const a = tile(5, 7), b = tile(6, 7), E = Bld3D.EXT, ch = { bl: [] };
      const f = (x0, x1, H) => ({ geom: sq(x0, 100, x1, 140, 0).b.g, props: { height: H } });
      Bld3D.keep(a, f(E - 30, E + 20, 25), ch, 0, 8); // доходит до края плитки a (с запасом за ним)
      Bld3D.keep(a, f(100, 140, 25), ch, 8, 8);       // посередине той же плитки
      Bld3D.keep(b, f(-20, 30, 25), ch, 0, 8);        // его часть в соседней плитке
      Bld3D.keep(b, f(-20, 30, 12), ch, 8, 8);        // другой дом там же, ниже
      Bld3D.gen++;
      const tw = Bld3D.twins(a.bs[0]);
      eq(tw.length, 1, 'у дома на краю — одна часть в соседней плитке:'); ok(tw[0] === b.bs[0], 'та же высота, рамки пересекаются');
      eq(Bld3D.twins(a.bs[1]).length, 0, 'у дома посередине плитки — нет');
      eq(a.hi, 25, 'самый высокий дом плитки:');
    } finally { Bld3D.tiles = keepT; Bld3D.gen = keepG; }
  });
  test('5.1.32: шейдер объёмных домов собирается (прозрачные дома — своим проходом)', () => {
    const cv = document.createElement('canvas'), gl = cv.getContext('webgl');

      ok(Bld3D.programs(), 'шейдеры собраны');

  atest('5.1.32: фигура за домом — тусклее (стили); дальняя — тоже, обучение — ещё тусклее', async () => {

      document.body.appendChild(box);

      ok(/opacity/.test(getComputedStyle(a).transitionProperty), 'тускнеет плавно');

  atest('5.1.34: здание из частей (купола, башни) — рисуются части, а не коробка общего контура; крыша места — по частям', async () => {
    const sq = (x0, y0, x1, y1) => [[{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }]];
    const cathedral = { geomType: 3, props: { kind: 'building', height: 67 }, geom: sq(100, 100, 200, 200) };      // контур собора — 67 м
    const dome = { geomType: 3, props: { kind: 'building_part', height: 54.6, min_height: 40 }, geom: sq(140, 140, 160, 160) };
    const nave = { geomType: 3, props: { kind: 'building_part', height: 18 }, geom: sq(105, 105, 195, 195) };
    const house = { geomType: 3, props: { kind: 'building', height: 20 }, geom: sq(300, 300, 340, 340) };            // дом без частей
    const shed = { geomType: 3, props: { kind: 'building_part', height: 5 }, geom: sq(400, 400, 410, 410) };          // часть чужая, вне контуров
    const fs = [cathedral, dome, nave, house, shed];
    const skip = Bld3D.outlines(fs);
    ok(skip.has(cathedral), 'контур собора с частями — не рисуется');
    ok(!skip.has(house), 'дом без частей — рисуется');
    ok(!skip.has(dome) && !skip.has(nave) && !skip.has(shed), 'части — рисуются');
    ok(Bld3D.outlines(fs) === skip, 'ответ — один раз на плитку данных');
    // постройка плитки: в памяти (и в кадре) — части и дом, без контура собора
    const keepQ = { queue: Bld3D.queue, busy: Bld3D.busy, map: Bld3D.map, dirty: Bld3D.dirty };
    try {
      Bld3D.dirty = () => {}; Bld3D.map = null;
      const t = { x: 1, y: 1, st: 'wait', parts: [] };
      await new Promise(res => Bld3D.buildOne(t, fs, res));
      eq(t.bs.length, 4, 'в плитке — купол, неф, дом и сарай:'); ok(!t.bs.some(b => b.H === 67), 'коробки в 67 м нет');
    } finally { Object.assign(Bld3D, keepQ); }
    // крыша места внутри собора — по частям (купол), а не по коробке контура
    const keepV = Hazard._view, keepR = MapView.roofSoon;
    try {
      const lat = 55.7525, lng = 37.6231, { px, py } = Hazard.tileOf(lat, lng);
      const at = (dx, dy, f) => ({ ...f, geom: f.geom.map(r => r.map(p => ({ x: p.x - 150 + px + dx, y: p.y - 150 + py + dy }))) });
      Hazard._view = { tileCache: { get: async () => new Map([['buildings', [at(0, 0, cathedral), at(0, 0, dome), at(0, 0, nave)]]]) } };
      MapView.roofSoon = () => {};
      Roofs.at.clear();
      Roofs.height(lat, lng); await new Promise(r => setTimeout(r, 0));
      eq(Roofs.height(lat, lng), 54.6, 'место — на куполе, а не на невидимой коробке в 67 м:');
    } finally { Hazard._view = keepV; MapView.roofSoon = keepR; Roofs.at.clear(); }
  });
  test('5.1.30: объёмные дома — крыши разбиты на треугольники без пропусков и лишнего (невыпуклые, с дворами)', () => {
    const area = (d, t) => {
      let s = 0;
      for (let i = 0; i < t.length; i += 3) {
        const [a, b, c] = [t[i], t[i + 1], t[i + 2]].map(j => [d[2 * j], d[2 * j + 1]]);
        s += Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1])) / 2;
      }
      return s;
    };
    const sq = [0, 0, 10, 0, 10, 10, 0, 10];
    eq(Earcut.run(sq).length, 6, 'квадрат — два треугольника');
    near(area(sq, Earcut.run(sq)), 100, 1e-9, 'квадрат:');
    const gl = [0, 0, 10, 0, 10, 4, 4, 4, 4, 10, 0, 10]; // буква Г — невыпуклый
    near(area(gl, Earcut.run(gl)), 64, 1e-9, 'невыпуклый — без лишней площади:');
    const yard = [0, 0, 10, 0, 10, 10, 0, 10, 3, 3, 3, 7, 7, 7, 7, 3]; // дом с двором
    near(area(yard, Earcut.run(yard, [4])), 84, 1e-9, 'двор — пустой:');
    const rev = [0, 10, 10, 10, 10, 0, 0, 0]; // обход в другую сторону
    near(area(rev, Earcut.run(rev)), 100, 1e-9, 'обход в любую сторону:');
  });
  test('5.1.30: объёмные дома — стены по рёбрам; общей стены соседей одной высоты и среза плитки нет', () => {
    const sq = (x, y, s) => [[{ x, y }, { x: x + s, y }, { x: x + s, y: y + s }, { x, y: y + s }]];
    const fs = [
      { geomType: 3, props: { height: 20 }, geom: sq(100, 100, 20) },
      { geomType: 3, props: { height: 20 }, geom: sq(120, 100, 20) }, // вплотную, той же высоты
      { geomType: 3, props: { height: 30 }, geom: sq(140, 100, 20) }, // вплотную, выше — его стена над соседом видна
      { geomType: 3, props: {}, geom: [[{ x: -30, y: 300 }, { x: 10, y: 300 }, { x: 10, y: 330 }, { x: -30, y: 330 }]] }, // срезан краем плитки
    ];
    fs.push({ geomType: 3, props: { height: 20, min_height: 6 }, geom: sq(300, 300, 10) }); // навес: стены — от шести метров
    const E = Bld3D.edges(fs), make = f => { const c = { v: [], idx: [], bb: [Infinity, Infinity, -Infinity, -Infinity] }; Bld3D.house(c, f, -1, Bld3D.EXT + 1, E); return c; };
    const walls = c => (c.idx.length - 6) / 6; // у прямоугольника крыша — два треугольника, стена — тоже два
    const [a, b, hi, cut, arch] = fs.map(make);
    eq(walls(a), 3, 'у первого — три стены (общая с соседом той же высоты не видна):');
    eq(walls(b), 2, 'у среднего — две (с обеих сторон соседи не ниже):');
    eq(walls(hi), 4, 'у высокого — все четыре (над низким соседом стена видна):');
    eq(walls(cut), 3, 'у срезанного краем плитки — без стены по срезу:');
    eq(cut.v[3], 8, 'нет высоты — восемь метров');
    eq(arch.v[3], 20, 'высота дома — из данных карты'); eq(arch.v[6], 6, 'низ стен навеса — над землёй');
  });
  atest('5.1.30: крыши — высота дома, в котором стоит место (по плитке карты), без хранения домов', async () => {

  test('5.1.24: обновление — удаляются кэши кода прошлых версий; кэш новой (его заполняет новый service worker), звуки и плитки остаются', () => {

  atest('5.1.24: облако — один общий запуск клиента на параллельные запросы; ранний запуск без регистрации новичка', async () => {
    const keep = { sb: Cloud.sb, cp: Cloud._cp, lib: Cloud._lib, sup: window.supabase, configured: Cloud.configured, client: Cloud.client, libF: Cloud.lib };
    let made = 0;
    const fakeSb = { auth: { getSession: async () => ({ data: { session: { user: { id: 'u' } } } }) } };
    try {
      window.supabase = { createClient: () => { made++; return fakeSb; } };
      Cloud.sb = null; Cloud._cp = null;
      const [a, b] = await Promise.all([Cloud.client(), Cloud.client()]);
      eq(made, 1, 'клиент создан один раз:');
      ok(a === fakeSb && b === fakeSb, 'оба запроса получили один и тот же клиент');
      eq(await Cloud.client(), fakeSb, 'готовый клиент — сразу');
      eq(made, 1, 'и больше не создаётся:');
      // ранний запуск: есть сохранённый вход — готовим клиент; нет — только библиотеку (гостя не регистрируем до проверки версии)
      const calls = [];
      Cloud.configured = () => true;
      Cloud.client = () => { calls.push('client'); return Promise.resolve(); };
      Cloud.lib = () => { calls.push('lib'); return Promise.resolve(); };
      const key = CLOUD_CONFIG.auth, saved = localStorage.getItem(key);
      try {
        localStorage.removeItem(key); Cloud.warm();
        localStorage.setItem(key, '{}'); Cloud.warm();
      } finally { if (saved == null) localStorage.removeItem(key); else localStorage.setItem(key, saved); }
      eq(calls.join(), 'lib,client', 'без входа — библиотека, со входом — клиент:');
    } finally { Object.assign(Cloud, { sb: keep.sb, _cp: keep.cp, _lib: keep.lib, configured: keep.configured, client: keep.client, lib: keep.libF }); window.supabase = keep.sup; }
  });
  /* ---------- вывод ---------- */
  (async () => {
    for (const t of pending) {
      try { await t.fn(); results.push({ name: t.name, ok: true }); }
      catch (e) { results.push({ name: t.name, ok: false, err: e.message }); }
    }
    const failed = results.filter(r => !r.ok);
    const sum = document.getElementById('sum');
    sum.textContent = failed.length ? `Провалено: ${failed.length} из ${results.length}` : `Все ${results.length} тестов пройдены`;
    sum.className = failed.length ? 'bad' : 'ok';
    document.getElementById('out').innerHTML = results.map(r => `<div class="t ${r.ok ? 'pass' : 'fail'}">${r.name}${r.err ? `<small>${r.err}</small>` : ''}</div>`).join('');
    window.TEST_RESULTS = { total: results.length, failed: failed.map(r => r.name + ': ' + r.err) };
  })();
