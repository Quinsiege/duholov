  <script>
  'use strict';
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, err: e.message }); }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'условие не выполнено'); }
  function eq(a, b, msg) { if (a !== b) throw new Error(`${msg || ''} ожидалось ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`); }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > eps) throw new Error(`${msg || ''} ${a} ≉ ${b}`); }
  const pending = [];
  function atest(name, fn) { pending.push({ name, fn }); }

  // Игра в памяти: ничего не пишем в localStorage
  S.save = () => {};
  Bus.emit = () => {};
  UI.toast = () => {};
  Friends.sync = () => {}; // без обращений к серверу
  Game.on = () => false;
  S.newGame('Тест', 'ugolek');
  S.d.level = 12;
  MapView.pos = { lat: 55.75, lng: 37.62 };
  const fresh = (sid, lvl = 10) => { const sp = S.makeSpirit(sid, lvl, 'seed' + sid + lvl); S.d.spirits.push(sp); return sp; };

  /* ---------- данные ---------- */
  // 4.15: языки — перевод по русскому ключу, подстановки, ошибки сервера по шаблону, формы числа, без словаря — русский
  test('Языки: ru`…`, I18N.back и формы числа', () => {
    eq(I18N.lang, 'ru', 'тесты идут на русском');
    eq(ru`Сила ${5}`, 'Сила 5');
    const was = { dict: I18N.dict, lang: I18N.lang, pats: I18N._pats };
    try {
      I18N.dict = { 'Сила {0}': 'Power {0}', 'Нужна команда': 'Team needed', '{0} ускользнул': '{0} got away', 'Уголёк': 'Ugolyok', 'Дань с {0} Капищ': '{0} tribute' };
      I18N._pats = null; I18N.lang = 'en';
      eq(ru`Сила ${7}`, 'Power 7');
      eq(ru('Нужна команда'), 'Team needed');
      eq(ru`Нет такого`, 'Нет такого', 'нет перевода — русский');
      eq(I18N.back('Нужна команда'), 'Team needed', 'ошибка сервера — точное совпадение');
      eq(I18N.back('Уголёк ускользнул'), 'Ugolyok got away', 'по шаблону, подстановка тоже переводится');
      eq(I18N.back('Совсем другое'), 'Совсем другое');
      eq(U.plural(1, 'a', 'b', 'c'), 'a'); eq(U.plural(3, 'a', 'b', 'c'), 'c'); eq(U.plural(21, 'a', 'b', 'c'), 'c');
      I18N.lang = 'ja'; eq(U.plural(1, 'a', 'b', 'c'), 'c');
      I18N.lang = 'fr'; eq(U.plural(0, 'a', 'b', 'c'), 'a');
    } finally { I18N.dict = was.dict; I18N.lang = was.lang; I18N._pats = was.pats; }
    eq(U.plural(3, 'a', 'b', 'c'), 'b', 'русские формы');
    eq(U.plural(21, 'a', 'b', 'c'), 'a');
  });
  test('У каждого духа уникальный id и корректные ссылки', () => {
    const ids = new Set();
    SPECIES.forEach(s => {
      ok(!ids.has(s.id), 'повтор ' + s.id); ids.add(s.id);
      ok(ELEMENTS[s.el], 'стихия ' + s.id);
      ok(SP[s.fam], 'семья ' + s.id);
      if (s.evo) { ok(SP[s.evo], 'превращение ' + s.id); ok(SP[s.evo].fam === s.fam, 'семья превращения ' + s.id); ok(s.cost > 0, 'цена ' + s.id); }
      ok(s.base.length === 3 && s.base.every(v => v > 50), 'статы ' + s.id);
      ok(RARITY[s.rar], 'редкость ' + s.id);
    });
  });
  test('Каждая стихия сильна против двух и слаба против двух', () => {
    ELEMENT_KEYS.forEach(e => {
      eq(ELEMENTS[e].beats.length, 2, e);
      eq(ELEMENT_KEYS.filter(x => ELEMENTS[x].beats.includes(e)).length, 2, e);
      ELEMENTS[e].beats.forEach(b => ok(!ELEMENTS[b].beats.includes(e), `взаимная сила ${e}/${b}`));
    });
  });
  test('Графика: все духи рисуются (обычные, сияющие, омрачённые) без NaN/undefined', () => {
    SPECIES.forEach(s => [[false, false], [true, false], [false, true]].forEach(([sh, dk]) => {
      const svg = Art.svgOf({ sid: s.id, shiny: sh, dark: dk }); // сам рисунок; наружу духи отдаются слоями (Art.spirit → Art.stack)
      ok(svg.startsWith('<svg'), s.id);
      ok(!/NaN|undefined/.test(svg), `${s.id}${sh ? ' сияющий' : ''}${dk ? ' омрачённый' : ''}`);
    }));
    ok(Art.img('ugolek').startsWith('<img'), 'Art.img');
    ok(Art.spirit('ugolek').startsWith('<span class="art art-stack'), 'Art.spirit — слоями: неподвижное картинками, анимированное — лёгким SVG');
    AMULET_KEYS.forEach(k => ok(!/NaN|undefined/.test(Art.amulet(k)), 'амулет ' + k));
  });
  test('Опыт до следующего уровня растёт на всех 40 уровнях', () => {
    for (let l = 2; l <= MAX_LEVEL; l++) ok(levelXP(l) > levelXP(l - 1), 'уровень ' + l);
  });

  /* ---------- утилиты и мир ---------- */
  test('Хеш детерминирован и лежит в [0, 1)', () => {
    eq(U.h('a', 1, 2), U.h('a', 1, 2));
    ok(U.h('a', 1, 2) !== U.h('a', 2, 1));
    for (let i = 0; i < 500; i++) { const v = U.h('x', i); ok(v >= 0 && v < 1, 'значение ' + v); }
    const r1 = U.rng('s'), r2 = U.rng('s');
    for (let i = 0; i < 10; i++) eq(r1(), r2());
  });
  test('Расстояние: 1° широты ≈ 111 км', () => near(U.dist(55, 37, 56, 37), 111195, 300));
  test('Духи на карте детерминированы и лежат в радиусе', () => {
    const a = W.spawnsAround(55.75, 37.62, 300), b = W.spawnsAround(55.75, 37.62, 300);
    eq(JSON.stringify(a.map(x => x.id + x.sid)), JSON.stringify(b.map(x => x.id + x.sid)));
    ok(a.length > 0, 'духов нет');
    a.forEach(x => { ok(x.d <= 300, 'радиус'); ok(SP[x.sid] && !SP[x.sid].legend, 'вид ' + x.sid); ok(x.lvl >= 1 && x.lvl <= 40, 'уровень'); });
  });
  test('Пойманный дух не выше уровня Ловчего (4.15)', () => {
    const lv = S.d.level;
    try {
      S.d.level = 3; eq(S.catchLvl(), 3);
      const a = W.spawnsAround(55.75, 37.62, 600); ok(a.length > 0, 'духов нет');
      a.forEach(x => ok(x.lvl >= 1 && x.lvl <= 3, 'уровень ' + x.lvl + ' выше уровня Ловчего'));
      S.d.level = 1; eq(S.catchLvl(), 1);
      W.spawnsAround(55.75, 37.62, 600).forEach(x => eq(x.lvl, 1, 'на 1-м уровне — духи 1-го уровня'));
    } finally { S.d.level = lv; }
  });
  test('Здоровье духов: раны, восстановление, без сил, лечение (4.15)', () => {
    const sp = { uid: 'hp1', sid: SPECIES[0].id, lvl: 5, iv: [5, 5, 5] }, t0 = 1e12, H = Rules.HP;
    eq(S.hpNow(sp, t0), 1, 'новый дух здоров');
    S.setHp(sp, 0.4, t0); near(S.hpNow(sp, t0), 0.4, 1e-9); near(S.hpNow(sp, t0 + 3600000), 0.4 + H.REGEN, 1e-9, 'сам восстанавливается');
    eq(S.hpNow(sp, t0 + 100 * 3600000), 1, 'не выше полного');
    S.setHp(sp, 0, t0); eq(S.hpNow(sp, t0 + 1000), 0, 'без сил'); ok(!S.alive(sp) || S.hpNow(sp) > 0);
    const ko = Rules.koMs(sp); eq(ko, H.KO_H[SPECIES[0].rar] * 3600000, 'срок — по редкости');
    eq(S.hpNow(sp, t0 + ko - 1), 0); eq(S.hpNow(sp, t0 + ko), H.BACK, 'поднимается сам на 10%');
    ok(Rules.koMs({ sid: 'koschey' }) === 24 * 3600000 && Rules.koMs({ sid: 'ugolek' }) === 2 * 3600000, 'от 2 до 24 часов');
    S.setHp(sp, 1, t0); ok(!('hpf' in sp) && !('ko' in sp), 'здоровый — без лишних полей');
  });
  test('Регионы: вещие птицы только в своих частях света', () => {
    eq(W.region(37), 'west'); eq(W.region(60), 'center'); eq(W.region(130), 'east');
    ok(W.local(SP.sirin, 37) && !W.local(SP.sirin, 100), 'Сирин');
    ok(W.local(SP.gamayun, 130) && !W.local(SP.gamayun, 37), 'Гамаюн');
    ok(W.local(SP.ugolek, 130), 'обычные духи везде');
  });
  // Реальные объекты: подкладываем набор «с сервера»
  const fakePois = [];
  for (let i = 0; i < 60; i++) {
    const id = 'osm:n' + (1000 + i);
    fakePois.push({ id, name: 'Объект ' + i, kind: i % 3 ? 'spring' : 'shrine', lat: 55.75 + (U.h('la', i) - 0.5) * 0.02, lng: 37.62 + (U.h('ln', i) - 0.5) * 0.03, photo: i === 1 ? 'u/p.jpg' : null });
  }
  fakePois.forEach(p => { p.t = Poi.tileId(p.lat, p.lng); Poi.list.set(p.id, p); });
  test('Родники, разломы и капища стоят у реальных объектов', () => {
    const sp = W.springsAround(55.75, 37.62, 2000);
    ok(sp.length > 0, 'родники');
    ok(sp.every(s => Poi.list.get(s.id) && Poi.list.get(s.id).kind === 'spring'), 'родник = объект типа «родник»');
    const rf = W.riftsAround(55.75, 37.62, 3000), sh = W.shrinesAround(55.75, 37.62, 3000);
    ok(rf.every(r => SP[r.boss] && r.tier >= 1 && r.tier <= 3 && r.place), 'разломы');
    ok(sh.length > 0, 'капища');
    const shrines = fakePois.filter(p => p.kind === 'shrine' && U.dist(55.75, 37.62, p.lat, p.lng) <= 3000).length;
    eq(rf.length + sh.length, shrines, 'разлом открывается вместо капища');
    ok(!sh.some(s => rf.some(r => r.id.startsWith(s.id + ':'))), 'капище с разломом скрыто');
    const g = W.guardian(sh[0]);
    eq(g.team.length, 3, 'команда хранителя');
    ok(g.team.every(x => !SP[x.sid].legend && !SP[x.sid].region), 'без легенд и региональных');
  });
  test('Квадраты карты и поиск объектов рядом', () => {
    eq(Poi.tileId(55.7515, 37.6195), '3761:5575');
    eq(Poi.tileId(-33.875, 151.215), '15121:-3388', 'южное и восточное полушарие');
    const t = Poi.tilesAround(55.75, 37.62, Poi.LOAD_R);
    ok(t.length >= 4 && t.length <= 30, 'квадратов вокруг: ' + t.length);
    ok(t.some(([x, y]) => `${x}:${y}` === Poi.tileId(55.75, 37.62)), 'свой квадрат');
    const n = Poi.near(55.75, 37.62, 500);
    ok(n.every(p => p.d <= 500), 'радиус');
    const nr = Poi.nearest(fakePois[5].lat, fakePois[5].lng, 5);
    eq(nr && nr.id, fakePois[5].id, 'ближайший');
    const good = '0b9f1c2e-1111-4a4a-9b9b-123456789abc/5f0c7d2a-2222-4b4b-8c8c-abcdefabcdef.jpg';
    ok(Poi.photoUrl(good).endsWith('/storage/v1/object/public/poi-photos/' + good), 'адрес фото');
    eq(Poi.photoUrl("x/a.jpg')\"><img src=x onerror=alert(1)>"), null, 'чужая строка вместо пути — отбрасывается');
  });
  test('Места из OpenStreetMap: отбор, названия, разрежение', () => {
    const els = [
      { type: 'node', id: 1, lat: 55.75, lon: 37.62, tags: { historic: 'monument', name: 'Памятник А' } },
      { type: 'node', id: 2, lat: 55.75005, lon: 37.62005, tags: { amenity: 'fountain' } },               // 7 м от первого — отсеется
      { type: 'way', id: 3, center: { lat: 55.752, lon: 37.622 }, tags: { leisure: 'park', name: 'Сквер', 'name:ru': 'Сквер Б' } },
      { type: 'node', id: 4, lat: 55.754, lon: 37.624, tags: { tourism: 'artwork' } },
      { type: 'node', id: 5, lat: 55.756, lon: 37.626, tags: { historic: 'memorial', access: 'private' } },  // частное
      { type: 'node', id: 6, lat: 55.758, lon: 37.628, tags: { shop: 'bakery', name: 'Булочная' } },       // не наша категория
      { type: 'node', id: 7, lat: 55.759, lon: 37.629, tags: { leisure: 'garden' } },                      // безымянный сад
      { type: 'node', id: 8, lat: 55.7605, lon: 37.63, tags: { amenity: 'place_of_worship', name: 'Храм В' } },
      { type: 'node', id: 9, lat: 55.762, lon: 37.632, tags: { historic: 'monument', name: 'В. Ф. Снегирёву' } },
      { type: 'node', id: 10, lat: 55.764, lon: 37.634, tags: { historic: 'memorial', memorial: 'plaque' } },
    ];
    const p = Osm.pick(els), ids = p.map(x => x.id);
    eq(ids.slice().sort().join(), ['osm:n1', 'osm:n10', 'osm:n4', 'osm:n8', 'osm:n9', 'osm:w3'].join(), 'отобранные');
    eq(p.find(x => x.id === 'osm:n9').name, 'Памятник В. Ф. Снегирёву', 'памятник по надписи');
    eq(p.find(x => x.id === 'osm:n1').name, 'Памятник А', 'без повтора');
    eq(p.find(x => x.id === 'osm:n10').name, 'Мемориальная доска', 'табличка');
    eq(p.find(x => x.id === 'osm:w3').name, 'Сквер Б', 'русское название');
    eq(p.find(x => x.id === 'osm:n4').name, 'Арт-объект', 'название по категории');
    eq(p.find(x => x.id === 'osm:n8').kind, 'spring', 'храм — всегда Родник');
    eq(JSON.stringify(Osm.pick(els)), JSON.stringify(p), 'детерминированно');
    ok(/historic.*bbox|\(55\.75,37\.62,55\.76,37\.63\)/.test(Osm.query(55.75, 37.62, 55.76, 37.63)), 'запрос с рамкой');
  });
  test('Геометка снимка: запись и чтение EXIF', () => {
    // минимальный JPEG-заголовок с JFIF — Exif.embed заменяет его на APP1
    const jfif = new Uint8Array([0xFF, 0xD8, 0xFF, 0xE0, 0, 16, 0x4A, 0x46, 0x49, 0x46, 0, 1, 1, 0, 0, 1, 0, 1, 0, 0, 0xFF, 0xDA, 0, 2, 0xFF, 0xD9]);
    const t = new Date(2026, 8, 23, 14, 5, 9).getTime();
    [[55.751244, 37.618423], [-33.856784, 151.215297], [40.689247, -74.044502]].forEach(([lat, lng]) => {
      const out = Exif.embed(jfif.buffer, { lat, lng, acc: 7.5, time: t });
      eq(out[2], 0xFF); eq(out[3], 0xE1, 'APP1 сразу после SOI');
      const g = Exif.read(out.buffer);
      ok(g, 'геометка прочитана');
      ok(U.dist(lat, lng, g.lat, g.lng) < 0.05, `координаты ${lat},${lng} → ${g.lat},${g.lng}`);
      near(g.acc, 7.5, 1e-9, 'точность');
      eq(g.time, t, 'время');
    });
    eq(Exif.read(jfif.buffer), null, 'без геометки');
  });
  /* ---------- духи ---------- */
  test('Сила растёт с уровнем, омрачённый бьёт на 20% сильнее', () => {
    const a = S.makeSpirit('kostrovik', 10, 'p'), b = { ...a, lvl: 20 }, c = { ...a, dark: true };
    ok(S.power(b) > S.power(a), 'сила');
    near(S.stats(c).atk / S.stats(a).atk, 1.2, 1e-9, 'атака');
    ok(S.stats(c).def < S.stats(a).def, 'защита');
  });
  test('Усиление тратит искры и эссенцию', () => {
    const sp = fresh('ugolek', 5); S.d.sparks = 10000; S.d.essence.ugolek = 50;
    const c = S.powerUpCost(sp), before = S.d.sparks;
    ok(S.powerUp(sp)); eq(sp.lvl, 6); eq(S.d.sparks, before - c.sparks);
    sp.lvl = S.maxLvl(); ok(!!S.canPowerUp(sp), 'предел уровня');
  });
  test('Превращение меняет вид и тратит эссенцию', () => {
    const sp = fresh('kapelka', 8); S.d.essence.kapelka = 30;
    ok(S.evolve(sp)); eq(sp.sid, 'luzhnica'); eq(S.d.essence.kapelka, 5);
    ok(!!S.canEvolve(sp), 'не хватит на следующую стадию');
  });
  test('Очищение: +2 к оценке (не выше 15), тьма снята', () => {
    const sp = fresh('babayka', 8); sp.dark = true; sp.iv = [14, 3, 15];
    S.d.sparks = 5000; S.d.essence.shoroh = 30; // очищение с 3.19: ✦ 3000 и 25 эссенции
    ok(S.purify(sp)); eq(sp.iv.join(), '15,5,15'); ok(!sp.dark && sp.purified);

    await must(A, 'passClaim', { lvl: 1, track: 'gold' });
    // вершина Золотой тропы — Знак Тропы
    A.data.pass.pts = Rules.PASS.PER * Rules.PASS.LEVELS;
    await must(A, 'passClaim', { lvl: 30, track: 'gold' }); ok(A.data.owned.trail, 'Знак Тропы получен');
    await must(A, 'look', { look: { cloak: '#6d28d9', eyes: '#5eead4', emblem: 'trail' } });
    // новый сезон — тропа с нуля
    A.data.pass.season = '1999-1';
    await must(A, 'tick'); await must(A, 'spring', { poi: freeSpring(A, 93100) });
    eq(A.data.pass.gold, false); ok(A.data.pass.season !== '1999-1', 'сезон сменился');
  });
  atest('Сервер: экономика 4.16 — посылка Ордена, родник при полной сумке, переплавка, Мёртвая вода раз в неделю, дань', async () => {
    const A = await newPlayer('ve', 55.52, 37.44, 'Хозяйка');
    A.data.tut = 0;
    const lim = asPlayer(A, () => S.bagLimit()), cnt = () => asPlayer(A, () => S.bagCount());
    // полная сумка: родник не открывается и не тратится
    A.data.items = { charm: lim };
    const sp = freeSpring(A, 94000);
    await refuse(A, 'spring', { poi: sp }, /Сумка полна/);
    ok(!A.data.springs[sp.id], 'родник не потрачен'); eq(Rules.dayUsed(A.data, 'springs'), 0, 'дневной лимит не тронут');
    // награда при полной сумке — в посылку, и об этом сообщение
    const r = await call(A, 'daily'); ok(r.ok);
    eq(cnt(), lim, 'сумка не переполнилась'); ok(asPlayer(A, () => S.parcelCount()) > 0, 'награда ждёт в посылке');
    ok(r.events.some(([ev, d]) => ev === 'toast' && /посылку Ордена/.test(d.text)), 'игроку сказано, где награда');
    await refuse(A, 'parcelTake', {}, /Сумка полна/);
    await must(A, 'discard', { k: 'charm', n: 100 });
    const t = await must(A, 'parcelTake'); ok(t.got.length > 0); eq(t.left, 0); eq(A.data.parcel, null, 'посылка разобрана');
    await refuse(A, 'parcelTake', {}, /пуста/);
    // родник при почти полной сумке: что не влезло — в посылку
    A.data.items = { charm: lim - 1 };
    const s2 = await must(A, 'spring', { poi: sp });
    eq(cnt(), lim); ok(asPlayer(A, () => S.parcelCount()) >= 3, 'добыча родника не пропала'); ok(!s2.got.some(x => !x.n));
    const dr = await must(A, 'parcelTake', { drop: true }); ok(dr.dropped >= 3); eq(A.data.parcel, null, 'посылку можно выбросить');
    A.data.items = { charm: 50 };
    // переплавка амулетов
    await refuse(A, 'amuletMelt', { from: 'perun', to: 'veles' }, /три|3/);
    A.data.amulets = { perun: 4 }; A.data.sparks = Rules.MELT.SPARKS;
    await refuse(A, 'amuletMelt', { from: 'perun', to: 'perun' }, /другой/);
    await refuse(A, 'amuletMelt', { from: '__proto__', to: 'veles' }, /нет/);
    const m = await must(A, 'amuletMelt', { from: 'perun', to: 'veles' });
    eq(m.left, 1); eq(A.data.amulets.veles, 1); eq(A.data.sparks, 0);
    await refuse(A, 'amuletMelt', { from: 'perun', to: 'veles' });
    // Мёртвая вода в Лавке — раз в неделю
    A.data.zlat = 1000;
    await must(A, 'shopBuy', { id: 'dead1' }); eq(A.data.items.deadwater, 1);
    await refuse(A, 'shopBuy', { id: 'dead1' }, /неделе/);
    A.data.weekc.w -= 1; // прошла неделя
    await must(A, 'shopBuy', { id: 'dead1' }); eq(A.data.items.deadwater, 2);
    // обменник: трата лишних искр, не больше DAY обменов в день
    A.data.sparks = 1e6; A.data.zlat = 0;
    await must(A, 'exchange', { n: Rules.EXCHANGE.DAY }); eq(A.data.zlat, Rules.EXCHANGE.ZLAT * Rules.EXCHANGE.DAY); eq(A.data.sparks, 1e6 - Rules.EXCHANGE.SPARKS * Rules.EXCHANGE.DAY);
    await refuse(A, 'exchange', { n: 1 }, /закрыт/);
    // дань: златники — не больше чем с Rules.ZLAT.tributeMax Капищ
    A.data.clan = 'volk'; A.data.tributeDay = ''; A.data.zlat = 0;
    const ids = [1, 2, 3, 4, 5].map(i => 'osm:n9' + i + '0000');
    ids.forEach(id => { DB.holds[id] = { clan: 'volk', holders: [{ pid: A.data.pid, name: 'Хозяйка', sp: { sid: 'ugolek', lvl: 5, iv: [1, 1, 1] }, t: Date.now() }], ver: 1 }; });
    try {
      const tr = await must(A, 'tribute'); eq(tr.n, 5);
      eq(A.data.zlat, Rules.ZLAT.tribute * Rules.ZLAT.tributeMax, 'златники дани — с трёх Капищ');
    } finally { ids.forEach(id => delete DB.holds[id]); }
  });

  // 4.16: Лига — два живых Ловчих через сервер игры (база в памяти — как 022_league_pvp.sql)
  const pvp = (who, op, args, now) => GameCore.pvp(op, args, envFor(who), now);
  const leaguer = async (uid, name, pts = 0) => {
    const P = await newPlayer(uid, 55.45, 37.33, name);
    P.data.tut = 0; P.data.level = League.LEVEL;
    ['kapelka', 'mshonok'].forEach(sid => P.data.spirits.push(asPlayer(P, () => S.makeSpirit(sid, 12, sid + uid))));
    P.data.spirits[0].lvl = 12;
    P.data.league = { season: League.season(), pts, best: League.rank(pts), peak: League.rank(pts), tickets: League.TICKETS, n: 0, day: asPlayer(P, () => U.today()), got: {} };
    return P;
  };
  const ago = (P, sec) => { P.srv.lq.since -= sec * 1000; };
  atest('Сервер: Лига 4.16 — два Ловчих: поиск, бой в реальном времени, итог и рейтинг обоим', async () => {
    const A = await leaguer('pv-a', 'Ратибор'), B = await leaguer('pv-b', 'Милена'), C = await leaguer('pv-c', 'Чужак');
    await refuse(A, 'leagueStart', {}, /Обнови игру/);
    A.data.level = League.LEVEL - 1; await refuse(A, 'pvpFind', {}, new RegExp(League.LEVEL + ' уровня')); A.data.level = League.LEVEL;
    A.data.team = [A.data.spirits[0].uid]; A.data.spirits.splice(1, 2); await refuse(A, 'pvpFind', {}, /три духа/);
    ['kapelka', 'mshonok'].forEach(sid => A.data.spirits.push(asPlayer(A, () => S.makeSpirit(sid, 12, sid + 'a2')))); A.data.team = [];
    const w = await must(A, 'pvpFind', {});
    ok(w.wait >= 0 && !w.match && w.n >= 1, 'ждём живого соперника — ботов нет');
    const f = await must(B, 'pvpFind', {});
    ok(f.match, 'пара составлена'); eq((await must(A, 'pvpFind', {})).match, f.match, 'первый узнаёт о паре при следующем запросе');
    const id = f.match;
    const r0 = await pvp(A, 'state', { id });
    ok(r0.ok && r0.seat === 'a' && r0.st.s.b.name === 'Милена', 'бой — у сервера, сторона — по входу');
    ok(r0.st.s.a.team.length === 3 && r0.st.s.a.team[0].max > 0, 'бойцы посчитаны сервером из сохранения');
    const t0 = r0.st.t0;
    // чужой в бою не ходит; подделки отклоняются целиком
    eq((await pvp(C, 'move', { id, in: [{ t: 'hit', n: 1 }] }, t0 + 100)).error, 'Бой не найден');
    const ver0 = DB.pvpM[id].ver;
    ok(!(await pvp(A, 'move', { id, in: [{ t: 'hit', n: 1 }, { t: 'hit', n: 40 }] }, t0 + 100)).ok, 'пачка с подделкой отклонена');
    eq(DB.pvpM[id].ver, ver0, 'и ничего не записано');
    const hp0 = DB.pvpM[id].state.s.b.team[0].cur;
    const h = await pvp(A, 'move', { id, in: [{ t: 'hit', n: 2 }] }, t0 + 500);
    ok(h.ok && h.res[0].got === 2 && h.st.s.b.team[0].cur < hp0, 'удар засчитан сервером');
    const B1 = await pvp(B, 'state', { id }, t0 + 600);
    eq(B1.st.s.b.team[0].cur, h.st.s.b.team[0].cur, 'соперник видит тот же бой');
    // гонка: оба пишут одну версию — второй перечитывает бой и повторяет ход
    const [x1, x2] = await Promise.all([pvp(A, 'move', { id, in: [{ t: 'hit', n: 1 }] }, t0 + 1600), pvp(B, 'move', { id, in: [{ t: 'hit', n: 1 }] }, t0 + 1600)]);
    ok(x1.ok && x2.ok && DB.pvpM[id].state.s.a.hits === 3 && DB.pvpM[id].state.s.b.hits === 1, 'оба хода записаны');
    // пока идёт бой — новый поиск возвращает его же, экран Лиги предлагает вернуться
    eq((await must(B, 'leagueState', {})).live, id);
    // Милена пропала со связи: через 20 с — поражение ей, победа Ратибору
    const tB = DB.pvpM[id].state.s.b.seen;
    await pvp(A, 'state', {}, tB + 5000).then(r => ok(!r.ok, 'без номера боя — отказ'));
    await pvp(A, 'move', { id, in: [{ t: 'sync' }] }, tB + 10000);
    const end = await pvp(A, 'state', { id }, tB + PvP.IDLE + 1000);
    ok(end.st.over && end.st.over.win === 'a' && end.st.over.why === 'idle', 'пропавший проиграл');
    eq(DB.pvpM[id].status, 'done');
    ok(!(await pvp(B, 'move', { id, in: [{ t: 'hit', n: 1 }] }, tB + PvP.IDLE + 2000)).res.some(x => x.ok), 'после конца ходы не идут');
    // итог — обоим, ровно один раз
    const xp0 = A.data.xp;
    const ra = (await must(A, 'pvpResult', {})).done;
    eq(ra.length, 1); ok(ra[0].win && ra[0].d === 30, 'победа над равным: +30'); eq(A.data.league.pts, 30);
    eq(A.data.league.tickets, League.TICKETS - 1, 'жетон — за сыгранный бой'); ok(A.data.xp > xp0, 'опыт за бой');
    ok(A.data.journal.some(j => j.type === 'pvp'), 'запись в дневнике'); eq(DB.league.filter(x => x.user === 'pv-a').pop().pts, 30, 'строка таблицы сезона');
    DB.pvpM[id].aS = false; // отметка в базе не записалась — повторно всё равно не засчитается
    eq((await must(A, 'pvpResult', {})).done.length, 0); eq(A.data.league.pts, 30);
    const xb = B.data.xp, rb = (await must(B, 'leagueState', {})).done;
    ok(rb.length === 1 && !rb[0].win && rb[0].why === 'idle', 'проигравшему — тоже, при входе в Лигу'); eq(B.data.league.pts, 0, 'не ниже нуля');
    eq(B.data.xp, xb, 'пропавшему опыта нет');
    // раны — по серверу: боец Милены ранен
    const uidB = DB.pvpM[id].state.s.b.team[0].uid;
    ok(asPlayer(B, () => S.hpNow(B.data.spirits.find(x => x.uid === uidB))) < 1, 'раны после боя посчитал сервер');
  });
  atest('Сервер: Лига 4.16 — круг поиска, граница лиг, отмена, повторный соперник, KO и сдача', async () => {
    Object.values(DB.pvpQ).forEach(q => { q.seen = 0; }); // прошлые заявки устарели
    const K = await leaguer('pv-k', 'Кметь', 1200), N = await leaguer('pv-n', 'Новик', 100);
    ok((await must(K, 'pvpFind', {})).wait != null && (await must(N, 'pvpFind', {})).wait != null, 'разные лиги — не пара');
    ago(N, 65); ok((await must(N, 'pvpFind', {})).wait != null, 'Новик ждёт минуту — но Кметь его ещё не принимает (пара — взаимная)');
    ago(K, 65); const m = await must(K, 'pvpFind', {});
    ok(m.match, 'оба долго ждут — пара через лиги');
    // брошенный с обеих сторон бой заканчивается при следующем входе: кто пропал раньше — проиграл
    const s = DB.pvpM[m.match].state;
    DB.pvpM[m.match].state = { ...s, at: s.at - 120000 };
    await must(N, 'leagueState', {});
    ok(DB.pvpM[m.match].status === 'done', 'брошенный бой закончен');
    // у самой границы — и соседняя лига
    const H = await leaguer('pv-h', 'Отрок-1', 290), I = await leaguer('pv-i', 'Отрок-2', 320);
    await must(H, 'pvpFind', {}); const hi = await must(I, 'pvpFind', {});
    ok(hi.match, '290 и 320: до границы чуть-чуть — пара сразу');
    // отмена: заявка убрана — пары нет
    const E = await leaguer('pv-e', 'Отменил', 2200), F = await leaguer('pv-f', 'Ждёт', 2210);
    await must(E, 'pvpFind', {}); await must(E, 'pvpCancel', {});
    ok(!(await must(F, 'pvpFind', {})).match, 'отменивший поиск в пару не попадает');
    // старая заявка (телефон молчит) — тоже
    DB.pvpQ['pv-f'].seen -= 9000;
    ok(!(await must(E, 'pvpFind', {})).match, 'молчащий дольше 8 с — не в паре');
    const ef = (await must(F, 'pvpFind', {})).match; ok(ef, 'вернулся — пара');
    // бой до конца: KO — все духи без сил; сдача
    const st = (await pvp(E, 'state', { id: ef })).st, t0 = st.t0, me = (await pvp(E, 'state', { id: ef })).seat, foe = PvP.other(me);
    DB.pvpM[ef].state.s[foe].team.forEach((x, i) => { x.cur = i ? 0 : 1; });
    const ko = await pvp(E, 'move', { id: ef, in: [{ t: 'hit', n: 1 }] }, t0 + 500);
    ok(ko.st.over && ko.st.over.why === 'ko' && ko.st.over.win === me, 'все духи соперника без сил — победа');
    const re = (await must(E, 'pvpResult', {})).done[0]; ok(re.win && re.d > 0);
    const rf0 = (await must(F, 'pvpResult', {})).done[0]; ok(!rf0.win && F.data.spirits.some(x => x.ko), 'проигравшему — раны: духи без сил');
    F.data.spirits.forEach(x => { delete x.ko; delete x.hpf; delete x.hpt; }); // вылечился
    // повторный соперник: сразу снова в пару не ставим (кроме долгого ожидания)
    await must(E, 'pvpFind', {}); ok(!(await must(F, 'pvpFind', {})).match, 'тот же соперник сразу — нет');
    ago(F, 31); const again = (await must(F, 'pvpFind', {})).match; ok(again, 'после 30 с ожидания — можно');
    const q = await pvp(F, 'move', { id: again, in: [{ t: 'quit' }] }, Date.now() + 100);
    ok(q.st.over.why === 'quit' && q.st.over.win !== q.seat, 'сдался — поражение');
    const xf = F.data.xp, rf = (await must(F, 'pvpResult', {})).done[0];
    ok(!rf.win && rf.d < 0, 'рейтинг за сдачу снят'); eq(F.data.xp, xf, 'опыта за сдачу нет');
  });
  /* ---------- вывод ---------- */
  (async () => {
    for (const t of pending) {
      try { await t.fn(); results.push({ name: t.name, ok: true }); }
      catch (e) { results.push({ name: t.name, ok: false, err: e.message }); }
    }
    const failed = results.filter(r => !r.ok);
    const sum = document.getElementById('sum');
    sum.textContent = failed.length ? `Провалено: ${failed.length} из ${results.length}` : `Все ${results.length} тестов пройдены`;
    sum.className = failed.length ? 'bad' : 'ok';
    document.getElementById('out').innerHTML = results.map(r => `<div class="t ${r.ok ? 'pass' : 'fail'}">${r.name}${r.err ? `<small>${r.err}</small>` : ''}</div>`).join('');
    window.TEST_RESULTS = { total: results.length, failed: failed.map(r => r.name + ': ' + r.err) };
  })();
  </script>
