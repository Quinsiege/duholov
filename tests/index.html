  <script>
  'use strict';
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, err: e.message }); }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'условие не выполнено'); }
  function eq(a, b, msg) { if (a !== b) throw new Error(`${msg || ''} ожидалось ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`); }
  function near(a, b, eps, msg) { if (Math.abs(a - b) > eps) throw new Error(`${msg || ''} ${a} ≉ ${b}`); }
  const pending = [];
  function atest(name, fn) { pending.push({ name, fn }); }

  // Игра в памяти: ничего не пишем в localStorage
  S.save = () => {};
  Bus.emit = () => {};
  UI.toast = () => {};
  Friends.sync = () => {}; // без обращений к серверу
  Game.on = () => false;
  S.newGame('Тест', 'ugolek');
  S.d.level = 12;
  MapView.pos = { lat: 55.75, lng: 37.62 };
  const fresh = (sid, lvl = 10) => { const sp = S.makeSpirit(sid, lvl, 'seed' + sid + lvl); S.d.spirits.push(sp); return sp; };

  /* ---------- данные ---------- */
  test('У каждого духа уникальный id и корректные ссылки', () => {
    const ids = new Set();
    SPECIES.forEach(s => {
      ok(!ids.has(s.id), 'повтор ' + s.id); ids.add(s.id);
      ok(ELEMENTS[s.el], 'стихия ' + s.id);
      ok(SP[s.fam], 'семья ' + s.id);
      if (s.evo) { ok(SP[s.evo], 'превращение ' + s.id); ok(SP[s.evo].fam === s.fam, 'семья превращения ' + s.id); ok(s.cost > 0, 'цена ' + s.id); }
      ok(s.base.length === 3 && s.base.every(v => v > 50), 'статы ' + s.id);
      ok(RARITY[s.rar], 'редкость ' + s.id);
    });
  });
  test('Каждая стихия сильна против двух и слаба против двух', () => {
    ELEMENT_KEYS.forEach(e => {
      eq(ELEMENTS[e].beats.length, 2, e);
      eq(ELEMENT_KEYS.filter(x => ELEMENTS[x].beats.includes(e)).length, 2, e);
      ELEMENTS[e].beats.forEach(b => ok(!ELEMENTS[b].beats.includes(e), `взаимная сила ${e}/${b}`));
    });
  });
  test('Графика: все духи рисуются (обычные, сияющие, омрачённые) без NaN/undefined', () => {
    SPECIES.forEach(s => [[false, false], [true, false], [false, true]].forEach(([sh, dk]) => {
      const svg = Art.svgOf({ sid: s.id, shiny: sh, dark: dk }); // сам рисунок; наружу духи отдаются картинкой (Art.spirit → <img>)
      ok(svg.startsWith('<svg'), s.id);
      ok(!/NaN|undefined/.test(svg), `${s.id}${sh ? ' сияющий' : ''}${dk ? ' омрачённый' : ''}`);
    }));
    ok(Art.img('ugolek').startsWith('<img'), 'Art.img');
    ok(Art.spirit('ugolek').startsWith('<img'), 'Art.spirit — картинка (растрируется один раз)');
    AMULET_KEYS.forEach(k => ok(!/NaN|undefined/.test(Art.amulet(k)), 'амулет ' + k));
  });
  test('Опыт до следующего уровня растёт на всех 40 уровнях', () => {
    for (let l = 2; l <= MAX_LEVEL; l++) ok(levelXP(l) > levelXP(l - 1), 'уровень ' + l);
  });

  /* ---------- утилиты и мир ---------- */
  test('Хеш детерминирован и лежит в [0, 1)', () => {
    eq(U.h('a', 1, 2), U.h('a', 1, 2));
    ok(U.h('a', 1, 2) !== U.h('a', 2, 1));
    for (let i = 0; i < 500; i++) { const v = U.h('x', i); ok(v >= 0 && v < 1, 'значение ' + v); }
    const r1 = U.rng('s'), r2 = U.rng('s');
    for (let i = 0; i < 10; i++) eq(r1(), r2());
  });
  test('Расстояние: 1° широты ≈ 111 км', () => near(U.dist(55, 37, 56, 37), 111195, 300));
  test('Духи на карте детерминированы и лежат в радиусе', () => {
    const a = W.spawnsAround(55.75, 37.62, 300), b = W.spawnsAround(55.75, 37.62, 300);
    eq(JSON.stringify(a.map(x => x.id + x.sid)), JSON.stringify(b.map(x => x.id + x.sid)));
    ok(a.length > 0, 'духов нет');
    a.forEach(x => { ok(x.d <= 300, 'радиус'); ok(SP[x.sid] && !SP[x.sid].legend, 'вид ' + x.sid); ok(x.lvl >= 1 && x.lvl <= 40, 'уровень'); });
  });
  test('Регионы: вещие птицы только в своих частях света', () => {
    eq(W.region(37), 'west'); eq(W.region(60), 'center'); eq(W.region(130), 'east');
    ok(W.local(SP.sirin, 37) && !W.local(SP.sirin, 100), 'Сирин');
    ok(W.local(SP.gamayun, 130) && !W.local(SP.gamayun, 37), 'Гамаюн');
    ok(W.local(SP.ugolek, 130), 'обычные духи везде');
  });
  // Реальные объекты: подкладываем набор «с сервера»
  const fakePois = [];
  for (let i = 0; i < 60; i++) {
    const id = 'osm:n' + (1000 + i);
    fakePois.push({ id, name: 'Объект ' + i, kind: i % 3 ? 'spring' : 'shrine', lat: 55.75 + (U.h('la', i) - 0.5) * 0.02, lng: 37.62 + (U.h('ln', i) - 0.5) * 0.03, photo: i === 1 ? 'u/p.jpg' : null });
  }
  fakePois.forEach(p => { p.t = Poi.tileId(p.lat, p.lng); Poi.list.set(p.id, p); });
  test('Родники, разломы и капища стоят у реальных объектов', () => {
    const sp = W.springsAround(55.75, 37.62, 2000);
    ok(sp.length > 0, 'родники');
    ok(sp.every(s => Poi.list.get(s.id) && Poi.list.get(s.id).kind === 'spring'), 'родник = объект типа «родник»');
    const rf = W.riftsAround(55.75, 37.62, 3000), sh = W.shrinesAround(55.75, 37.62, 3000);
    ok(rf.every(r => SP[r.boss] && r.tier >= 1 && r.tier <= 3 && r.place), 'разломы');
    ok(sh.length > 0, 'капища');
    const shrines = fakePois.filter(p => p.kind === 'shrine' && U.dist(55.75, 37.62, p.lat, p.lng) <= 3000).length;
    eq(rf.length + sh.length, shrines, 'разлом открывается вместо капища');
    ok(!sh.some(s => rf.some(r => r.id.startsWith(s.id + ':'))), 'капище с разломом скрыто');
    const g = W.guardian(sh[0]);
    eq(g.team.length, 3, 'команда хранителя');
    ok(g.team.every(x => !SP[x.sid].legend && !SP[x.sid].region), 'без легенд и региональных');
  });
  test('Квадраты карты и поиск объектов рядом', () => {
    eq(Poi.tileId(55.7515, 37.6195), '3761:5575');
    eq(Poi.tileId(-33.875, 151.215), '15121:-3388', 'южное и восточное полушарие');
    const t = Poi.tilesAround(55.75, 37.62, Poi.LOAD_R);
    ok(t.length >= 4 && t.length <= 30, 'квадратов вокруг: ' + t.length);
    ok(t.some(([x, y]) => `${x}:${y}` === Poi.tileId(55.75, 37.62)), 'свой квадрат');
    const n = Poi.near(55.75, 37.62, 500);
    ok(n.every(p => p.d <= 500), 'радиус');
    const nr = Poi.nearest(fakePois[5].lat, fakePois[5].lng, 5);
    eq(nr && nr.id, fakePois[5].id, 'ближайший');
    const good = '0b9f1c2e-1111-4a4a-9b9b-123456789abc/5f0c7d2a-2222-4b4b-8c8c-abcdefabcdef.jpg';
    ok(Poi.photoUrl(good).endsWith('/storage/v1/object/public/poi-photos/' + good), 'адрес фото');
    eq(Poi.photoUrl("x/a.jpg')\"><img src=x onerror=alert(1)>"), null, 'чужая строка вместо пути — отбрасывается');
  });
  test('Места из OpenStreetMap: отбор, названия, разрежение', () => {
    const els = [
      { type: 'node', id: 1, lat: 55.75, lon: 37.62, tags: { historic: 'monument', name: 'Памятник А' } },
      { type: 'node', id: 2, lat: 55.75005, lon: 37.62005, tags: { amenity: 'fountain' } },               // 7 м от первого — отсеется
      { type: 'way', id: 3, center: { lat: 55.752, lon: 37.622 }, tags: { leisure: 'park', name: 'Сквер', 'name:ru': 'Сквер Б' } },
      { type: 'node', id: 4, lat: 55.754, lon: 37.624, tags: { tourism: 'artwork' } },
      { type: 'node', id: 5, lat: 55.756, lon: 37.626, tags: { historic: 'memorial', access: 'private' } },  // частное
      { type: 'node', id: 6, lat: 55.758, lon: 37.628, tags: { shop: 'bakery', name: 'Булочная' } },       // не наша категория
      { type: 'node', id: 7, lat: 55.759, lon: 37.629, tags: { leisure: 'garden' } },                      // безымянный сад
      { type: 'node', id: 8, lat: 55.7605, lon: 37.63, tags: { amenity: 'place_of_worship', name: 'Храм В' } },
      { type: 'node', id: 9, lat: 55.762, lon: 37.632, tags: { historic: 'monument', name: 'В. Ф. Снегирёву' } },
      { type: 'node', id: 10, lat: 55.764, lon: 37.634, tags: { historic: 'memorial', memorial: 'plaque' } },
    ];
    const p = Osm.pick(els), ids = p.map(x => x.id);
    eq(ids.slice().sort().join(), ['osm:n1', 'osm:n10', 'osm:n4', 'osm:n8', 'osm:n9', 'osm:w3'].join(), 'отобранные');
    eq(p.find(x => x.id === 'osm:n9').name, 'Памятник В. Ф. Снегирёву', 'памятник по надписи');
    eq(p.find(x => x.id === 'osm:n1').name, 'Памятник А', 'без повтора');
    eq(p.find(x => x.id === 'osm:n10').name, 'Мемориальная доска', 'табличка');
    eq(p.find(x => x.id === 'osm:w3').name, 'Сквер Б', 'русское название');
    eq(p.find(x => x.id === 'osm:n4').name, 'Арт-объект', 'название по категории');
    eq(p.find(x => x.id === 'osm:n8').kind, 'spring', 'храм — всегда Родник');
    eq(JSON.stringify(Osm.pick(els)), JSON.stringify(p), 'детерминированно');
    ok(/historic.*bbox|\(55\.75,37\.62,55\.76,37\.63\)/.test(Osm.query(55.75, 37.62, 55.76, 37.63)), 'запрос с рамкой');
  });
  test('Геометка снимка: запись и чтение EXIF', () => {
    // минимальный JPEG-заголовок с JFIF — Exif.embed заменяет его на APP1
    const jfif = new Uint8Array([0xFF, 0xD8, 0xFF, 0xE0, 0, 16, 0x4A, 0x46, 0x49, 0x46, 0, 1, 1, 0, 0, 1, 0, 1, 0, 0, 0xFF, 0xDA, 0, 2, 0xFF, 0xD9]);
    const t = new Date(2026, 8, 23, 14, 5, 9).getTime();
    [[55.751244, 37.618423], [-33.856784, 151.215297], [40.689247, -74.044502]].forEach(([lat, lng]) => {
      const out = Exif.embed(jfif.buffer, { lat, lng, acc: 7.5, time: t });
      eq(out[2], 0xFF); eq(out[3], 0xE1, 'APP1 сразу после SOI');
      const g = Exif.read(out.buffer);
      ok(g, 'геометка прочитана');
      ok(U.dist(lat, lng, g.lat, g.lng) < 0.05, `координаты ${lat},${lng} → ${g.lat},${g.lng}`);
      near(g.acc, 7.5, 1e-9, 'точность');
      eq(g.time, t, 'время');
    });
    eq(Exif.read(jfif.buffer), null, 'без геометки');
  });
  /* ---------- духи ---------- */
  test('Сила растёт с уровнем, омрачённый бьёт на 20% сильнее', () => {
    const a = S.makeSpirit('kostrovik', 10, 'p'), b = { ...a, lvl: 20 }, c = { ...a, dark: true };
    ok(S.power(b) > S.power(a), 'сила');
    near(S.stats(c).atk / S.stats(a).atk, 1.2, 1e-9, 'атака');
    ok(S.stats(c).def < S.stats(a).def, 'защита');
  });
  test('Усиление тратит искры и эссенцию', () => {
    const sp = fresh('ugolek', 5); S.d.sparks = 10000; S.d.essence.ugolek = 50;
    const c = S.powerUpCost(sp), before = S.d.sparks;
    ok(S.powerUp(sp)); eq(sp.lvl, 6); eq(S.d.sparks, before - c.sparks);
    sp.lvl = S.maxLvl(); ok(!!S.canPowerUp(sp), 'предел уровня');
  });
  test('Превращение меняет вид и тратит эссенцию', () => {
    const sp = fresh('kapelka', 8); S.d.essence.kapelka = 30;
    ok(S.evolve(sp)); eq(sp.sid, 'luzhnica'); eq(S.d.essence.kapelka, 5);
    ok(!!S.canEvolve(sp), 'не хватит на следующую стадию');
  });
  test('Очищение: +2 к оценке (не выше 15), тьма снята', () => {
    const sp = fresh('babayka', 8); sp.dark = true; sp.iv = [14, 3, 15];
    S.d.sparks = 5000; S.d.essence.shoroh = 30; // очищение с 3.19: ✦ 3000 и 25 эссенции
    ok(S.purify(sp)); eq(sp.iv.join(), '15,5,15'); ok(!sp.dark && sp.purified);
  });
  test('Баланс 3.19: кривая уровней, перенос опыта, коконы, сумка, эссенция', () => {
    // кривая: до 10 как раньше, дальше круче; растёт строго
    for (let n = 2; n <= 10; n++) eq(levelXP(n), levelXPOld(n), 'до 10 уровня без изменений');
    for (let n = 2; n <= 40; n++) ok(levelXP(n) > levelXP(n - 1), 'растёт');
    ok(levelXP(20) > 80000 && levelXP(20) < 100000, 'L20 ≈ 90 тыс.'); ok(levelXP(40) > 1.8e6 && levelXP(40) < 2.4e6, 'L40 ≈ 2,1 млн');
    // перенос опыта: уровень не падает, место внутри уровня сохраняется
    const keep = S.d;
    S.d = { level: 21, xp: 77180, spirits: [], items: {}, stats: {} }; S.migrate();
    eq(S.d.level, 21); ok(S.d.xp >= levelXP(21) && S.d.xp < levelXP(22), 'опыт внутри 21 уровня по новой кривой'); eq(S.d.xpv, 2);
    const x1 = S.d.xp; S.migrate(); eq(S.d.xp, x1, 'второй раз не переносится');
    S.d = { level: 5, xp: 5000, spirits: [], items: {}, stats: {} }; S.migrate(); eq(S.d.xp, 5000, 'новичков не трогает');
    S.d = keep;
    // коконы — только первая стадия
    for (let i = 0; i < 60; i++) { const km = [2, 5, 10][i % 3]; const r = S.hatch({ id: 'balance' + i, km }); eq(SP[r.sp.sid].stage, 1, 'из кокона первая стадия'); }
    // сумка полна: награда за достижение приходит, добыча родника — нет
    S.d.items = { charm: S.bagLimit() };
    const got = S.giveRewards({ honey: 3 }); eq(S.d.items.honey, 3, 'награда сверх лимита'); eq(got[0].n, 3);
    const loot = S.giveRewards({ water: 2 }, false); ok(!S.d.items.water && !loot.length, 'родник лимит соблюдает');
    S.d.items = { charm: 50 };
    // эссенция растёт с редкостью
    const common = SPECIES.find(s => s.rar === 1 && s.stage === 1), epic = SPECIES.find(s => s.rar === 4 && s.stage === 1);
    eq(Rules.catchReward({ sid: common.id, mode: 'wild' }).ess, 3); eq(Rules.catchReward({ sid: epic.id, mode: 'wild' }).ess, 9, 'эпический — 9 эссенции');
  });
  test('Амулеты: надеть, снять, вернуть при отпускании', () => {
    const sp = fresh('mshonok', 10); S.d.amulets = { perun: 1 };
    const atk0 = S.battle(sp).atk;
    ok(S.equip(sp, 'perun')); eq(S.d.amulets.perun, 0);
    near(S.battle(sp).atk / atk0, 1.12, 1e-9, 'атака');
    eq(S.power(sp), S.stats({ ...sp, amulet: null }).power, 'сила в карточке не меняется');
    S.release(sp.uid); eq(S.d.amulets.perun, 1, 'вернулся в сумку');
  });
  test('Второй приём: цена и повторное изучение запрещено', () => {
    const sp = fresh('vayfayka', 10); S.d.sparks = MOVE2_COST.sparks; S.d.essence.vayfayka = MOVE2_COST.essence;
    ok(S.learnMove2(sp)); ok(sp.move2); eq(S.d.sparks, 0); ok(!!S.canLearnMove2(sp));
  });
  test('Эффективность стихий в бою', () => {
    eq(Raid.eff('fire', 'forest'), 1.6); eq(Raid.eff('forest', 'fire'), 0.625); eq(Raid.eff('fire', 'fire'), 1);
    ok(Raid.dmg(100, 100, 10, 'fire', 'forest') > Raid.dmg(100, 100, 10, 'fire', 'fire'));
  });

  /* ---------- системы ---------- */
  test('Православная Пасха', () => {
    const f = d => `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
    eq(f(Ev.easter(2024)), '2024-5-5'); eq(f(Ev.easter(2025)), '2025-4-20');

    const res = await GameCore.run({ a: [{ type, args }], tz: who.tz != null ? who.tz : 180, wx: null, pos: { lat: who.lat, lng: who.lng, acc: 10 }, v: APP_VERSION }, { data: who.data, srv: who.srv }, envFor(who));
    if (!res.ok && res.rl) who.srv = { ...who.srv, rl: res.rl }; // как на сервере: счётчики частоты сохраняются и при отказе
    if (res.ok) {
      who.data = res.data; who.srv = res.srv;
      if (res.data) DB.saves[who.uid] = res.data; else delete DB.saves[who.uid];
      for (const fn of res.after) await fn();

    return res;
  }

    const r = await call(who, type, args);
    if (r.ok) throw new Error(`${type} должно быть отклонено`);
    if (re && !re.test(r.error)) throw new Error(`${type}: неожиданная ошибка «${r.error}»`);
  };

  const asPlayer = (who, fn) => { const d = S.d, tz = U.tz; S.d = who.data; U.tz = 180; try { return fn(); } finally { S.d = d; U.tz = tz; } };

    B.data.league.stars = 10; const n = DB.league.length; await must(B, 'leagueTop', { board: false }); eq(DB.league.length, n, 'скрытый из таблицы — не пишем');
  });
  atest('Безопасность: облик, имена, служебные действия, коды, перебор', async () => {
    // облик от другого игрока не вырывается из атрибута SVG
    const bad = Art.avatar({ cloak: '#fff"/><script>alert(1)<\/script>', eyes: 'red" onload="x', emblem: '__proto__' });
    ok(!/script|onload|__proto__/.test(bad), 'в облике только проверенные цвета');
    ok(Art.avatar({ cloak: '#0c4a6e', eyes: '#5eead4', emblem: 'charm' }).includes('#0c4a6e'), 'свой цвет плаща сохраняется');
    // имена и клички на сервере — без символов разметки
    eq(GameCore.cleanText('  <img src=x onerror="a">Вася  ', 40), 'img src=x onerror=aВася', 'разметка вычищена');
    eq(GameCore.cleanText('Ёжик   в\nтумане', 16), 'Ёжик в тумане');
    const A = await newPlayer('vn', 55.49, 37.37, '<b>Хакер</b>');
    eq(A.data.name, 'bХакер/b', 'имя без разметки');
    await must(A, 'nick', { uid: A.data.spirits[0].uid, nick: '<svg onload=1>' }); ok(!/[<>]/.test(A.data.spirits[0].nick), 'кличка без разметки');
    // служебные поля объекта не вызываются как действия
    for (const type of ['constructor', 'toString', '__proto__', 'hasOwnProperty']) await refuse(A, type, {}, /Неизвестное действие/);
    // коды — из криптостойкого генератора, нужной длины и алфавита
    const codes = new Set(Array.from({ length: 200 }, () => U.code(10)));
    eq(codes.size, 200, 'коды не повторяются'); ok([...codes].every(c => /^[A-HJ-NP-Z2-9]{10}$/.test(c)), 'алфавит без похожих символов');
    // перебор кодов посылок и дружбы ограничен
    for (let i = 0; i < 30; i++) await refuse(A, 'friendAdd', { pid: 'zz' + U.code(12).toLowerCase() }, /не найден/);
    await refuse(A, 'friendAdd', { pid: 'zz' + U.code(12).toLowerCase() }, /часто/);
  });
  atest('Оферта: наборы и цены совпадают с Казной (Rules.PAY)', async () => {
    const html = await fetch('../www/offer.html?t=' + Date.now()).then(r => r.text());
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rows = [...doc.querySelectorAll('#packs tr')];
    eq(rows.length, Rules.PAY.length, 'все наборы в оферте');
    Rules.PAY.forEach(p => {
      const tr = doc.querySelector(`#packs tr[data-pack="${p.id}"]`);
      ok(tr, 'набор ' + p.id);
      const [name, price] = [...tr.children].map(td => td.textContent.replace(/\s/g, ''));
      eq(name, `${p.zlat}златников`); eq(price, `${p.rub}₽`);
    });
  });
  atest('Сервер: Казна — оплаченные наборы начисляются ровно один раз', async () => {
    const A = await newPlayer('vl', 55.50, 37.38, 'Меценат'), B = await newPlayer('vm', 55.50, 37.38, 'Сосед');
    A.data.zlat = 0;
    DB.payments.push({ id: 'p1', uid: 'vl', pack: 'z330', zlat: 330, status: 'succeeded', credited: false },
      { id: 'p2', uid: 'vl', pack: 'z100', zlat: 100, status: 'pending', credited: false },
      { id: 'p3', uid: 'vm', pack: 'z2600', zlat: 2600, status: 'succeeded', credited: false });
    const r = await must(A, 'payClaim'); eq(r.zlat, 330); eq(A.data.zlat, 330, 'только оплаченный и только свой');
    ok(DB.payments[0].credited, 'отмечено в таблице'); ok(A.data.paid.p1, 'номер оплаты — в прогрессе');
    // отметка в таблице не записалась — повторно не начисляем
    DB.payments[0].credited = false;
    eq((await must(A, 'payClaim')).zlat, 0); eq(A.data.zlat, 330);
    // оплата прошла позже
    DB.payments[1].status = 'succeeded';
    eq((await must(A, 'payClaim')).zlat, 100); eq(A.data.zlat, 430);
    eq((await must(B, 'payClaim')).zlat, 2600, 'у соседа — своя оплата');
  });
  atest('Сервер: Сезонная тропа — очки за игру, ступени, Золотая тропа', async () => {
    const A = await newPlayer('vi', 55.53, 37.41, 'Путник');
    A.data.tut = 0;
    await must(A, 'spring', { poi: freeSpring(A, 93000) });
    ok(A.data.pass && A.data.pass.pts > 0, 'очки Тропы за родник');
    const season = A.data.pass.season;
    A.data.pass = { season, pts: Rules.PASS.PER * 2 + 5, gold: false, got: { free: [], gold: [] } };
    const r = await must(A, 'passClaim', { lvl: 1, track: 'free' }); ok(r.got.length > 0, 'награда ступени 1');
    await refuse(A, 'passClaim', { lvl: 1, track: 'free' }, /уже получена/);
    await refuse(A, 'passClaim', { lvl: 3, track: 'free' }, /не пройдена/);
    await refuse(A, 'passClaim', { lvl: 1, track: 'gold' }, /Золотую тропу/);
    await refuse(A, 'passGold', {}, /златников/);
    A.data.zlat = Rules.PASS.GOLD;
    await must(A, 'passGold'); eq(A.data.zlat, 0); ok(A.data.pass.gold);
    await must(A, 'passClaim', { lvl: 1, track: 'gold' });
    // вершина Золотой тропы — Знак Тропы
    A.data.pass.pts = Rules.PASS.PER * Rules.PASS.LEVELS;
    await must(A, 'passClaim', { lvl: 30, track: 'gold' }); ok(A.data.owned.trail, 'Знак Тропы получен');
    await must(A, 'look', { look: { cloak: '#6d28d9', eyes: '#5eead4', emblem: 'trail' } });
    // новый сезон — тропа с нуля
    A.data.pass.season = '1999-1';
    await must(A, 'tick'); await must(A, 'spring', { poi: freeSpring(A, 93100) });
    eq(A.data.pass.gold, false); ok(A.data.pass.season !== '1999-1', 'сезон сменился');
  });

  /* ---------- вывод ---------- */
  (async () => {
    for (const t of pending) {
      try { await t.fn(); results.push({ name: t.name, ok: true }); }
      catch (e) { results.push({ name: t.name, ok: false, err: e.message }); }
    }
    const failed = results.filter(r => !r.ok);
    const sum = document.getElementById('sum');
    sum.textContent = failed.length ? `Провалено: ${failed.length} из ${results.length}` : `Все ${results.length} тестов пройдены`;
    sum.className = failed.length ? 'bad' : 'ok';
    document.getElementById('out').innerHTML = results.map(r => `<div class="t ${r.ok ? 'pass' : 'fail'}">${r.name}${r.err ? `<small>${r.err}</small>` : ''}</div>`).join('');
    window.TEST_RESULTS = { total: results.length, failed: failed.map(r => r.name + ': ' + r.err) };
  })();
  </script>
