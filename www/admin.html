<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- CSP: чужие скрипты (в том числе внедрённые через данные игроков) не выполнятся; список адресов — все, к которым ходит игра -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://api.duholov.ru https://api-test.duholov.ru; connect-src 'self' https://api.duholov.ru wss://api.duholov.ru https://api-test.duholov.ru wss://api-test.duholov.ru https://overpass-api.de https://overpass.private.coffee https://maps.mail.ru; media-src 'self' blob: data:; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Духолов · Модерация</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.min.css?v=dev" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb">
  <script src="vendor/leaflet/leaflet.min.js?v=dev" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"></script>
  <script src="vendor/supabase.min.js?v=dev" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug"></script>
  <script src="js/version.js?v=dev"></script>
  <script src="js/config.js?v=dev"></script>
  <script src="js/exif.js?v=dev"></script>
  <script src="js/osm.js?v=dev"></script>
  <style>
    :root { --bg: #120c24; --bg2: #1c1438; --card: #231a45; --line: rgba(255,255,255,.12); --text: #f3f0ff; --muted: #b3aacb; --gold: #fbbf24; --ok: #86efac; --bad: #fca5a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 2000; }
    header h1 { font-size: 18px; margin: 0; }
    header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 4px; }
    .tabs button { padding: 6px 12px; border-radius: 8px; color: var(--muted); }
    .tabs button.on { background: rgba(255,255,255,.12); color: var(--text); }
    main { padding: 20px; max-width: 1300px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .login { max-width: 420px; margin: 60px auto; }
    .input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); }
    .btn { padding: 9px 16px; border-radius: 10px; background: rgba(255,255,255,.12); font-weight: 600; }
    .btn.primary { background: var(--gold); color: #1c1438; }
    .btn.ok { background: #16a34a; color: #fff; }
    .btn.no { background: #dc2626; color: #fff; }
    .btn:disabled { opacity: .5; cursor: default; }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .queue { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
    .qlist { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 120px); overflow: auto; }
    .qitem { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: left; }
    .qitem.on { border-color: var(--gold); }
    .qitem img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; }
    .qitem b { display: block; }
    .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
    .detail img.photo { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; object-fit: contain; }
    .map { height: 320px; border-radius: 12px; overflow: hidden; }
    .bigmap { height: calc(100vh - 110px); border-radius: 16px; overflow: hidden; }
    .checks { list-style: none; padding: 0; margin: 10px 0; }
    .checks li { padding: 4px 0; }
    .checks .ok::before { content: '✓ '; color: var(--ok); font-weight: 700; }
    .checks .bad::before { content: '✗ '; color: var(--bad); font-weight: 700; }
    .checks .warn::before { content: '! '; color: var(--gold); font-weight: 700; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    label.f { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .st-approved { color: var(--ok); } .st-rejected { color: var(--bad); }
    .pin-me { stroke: #fff; fill: #38bdf8; fill-opacity: 1; }
    .pin-obj { stroke: #92400e; fill: var(--gold); fill-opacity: 1; }
    .pin-poi { stroke: #0f766e; fill: #5eead4; fill-opacity: .9; }
    .pin-shrine { stroke: #7c2d12; fill: #fb923c; fill-opacity: .9; }
    .pin-off { stroke: #555; fill: #999; fill-opacity: .6; }
    .pin-player { stroke: #fff; stroke-width: 2; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card); color: var(--text); }
    .leaflet-popup-content .input { margin: 4px 0; }
    /* 5.1.22: аналитика. Цвета проверены на фоне карточки (#231a45): s1 — основной ряд, s2 — второй ряд стопки, s0 — фон
       «остальное» (приглушённый серый); сетка и оси — волосяные линии */
    .an { --s1: #3987e5; --s2: #d95926; --s0: #6e6a80; --grid: rgba(255,255,255,.08); --axis: rgba(255,255,255,.22); }
    .an-filters { display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; font-size: 13px; }
    .seg { display: inline-flex; gap: 2px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 2px; margin-left: 6px; }
    .seg button { padding: 5px 10px; border-radius: 8px; color: var(--muted); }
    .seg button.on { background: rgba(255,255,255,.14); color: var(--text); font-weight: 600; }
    .an-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; transition: opacity .2s; } /* широкие таблицы листаются внутри .tw */
    .an-grid.loading { opacity: .5; pointer-events: none; }
    .an h2 { margin: 0 0 4px; font-size: 17px; }
    .an h3 { margin: 18px 0 6px; font-size: 15px; }
    .an .sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 0 0 14px; }
    .kpi { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .kpi b { display: block; font-size: 22px; font-weight: 650; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 0 0 6px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .sw1 { background: var(--s1); } .sw2 { background: var(--s2); } .sw0 { background: var(--s0); }
    .colchart { display: flex; gap: 6px; margin: 4px 0 10px; }
    .colchart .yl { display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--muted); text-align: right; min-width: 28px; font-variant-numeric: tabular-nums; }
    .colchart .yl span { line-height: 1; }
    .colchart .yl span:first-child { transform: translateY(-50%); } .colchart .yl span:last-child { transform: translateY(50%); }
    .an .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 8px; }
    @media (max-width: 900px) { .an .two { grid-template-columns: minmax(0, 1fr); } }
    .colchart .plot { flex: 1; min-width: 0; }
    .cols { display: flex; align-items: stretch; border-bottom: 1px solid var(--axis);
      background: linear-gradient(var(--grid), var(--grid)) 0 0 / 100% 1px no-repeat, linear-gradient(var(--grid), var(--grid)) 0 50% / 100% 1px no-repeat; }
    .cols .c { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; outline: none; }
    .cols .c i { display: block; width: min(24px, 76%); }
    .cols .c i:first-child { border-radius: 4px 4px 0 0; }
    .cols .c i + i { margin-top: 2px; }
    .cols .c:hover i, .cols .c:focus-visible i { filter: brightness(1.25); }
    .xl { display: flex; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .xl span { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; overflow: visible; }
    i.s1 { background: var(--s1); } i.s2 { background: var(--s2); } i.s0 { background: var(--s0); }
    .tw { overflow-x: auto; }
    .an table { font-size: 13px; }
    .an td, .an th { padding: 6px 8px; white-space: nowrap; }
    .an th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .an td.num, .an th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .an td.lbl { white-space: normal; min-width: 140px; }
    .an tr.grp td { color: var(--muted); font-size: 12px; padding-top: 14px; border-bottom: 0; }
    .hb { display: flex; gap: 2px; height: 14px; min-width: 80px; width: 100%; }
    .hb i { display: block; height: 100%; min-width: 2px; }
    .hb i:last-child { border-radius: 0 4px 4px 0; }
    td.bar { width: 40%; min-width: 100px; }
    td.heat { text-align: right; font-variant-numeric: tabular-nums; }
    td.heat.now { font-style: italic; }
    .an-tip { position: fixed; z-index: 3000; pointer-events: none; background: #0d0a1a; border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 9px; font-size: 12px; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .an details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 6px 0; }
    @media (max-width: 900px) { .queue, .detail { grid-template-columns: 1fr; } .qlist { max-height: none; }
      header, .tabs { flex-wrap: wrap; } /* 5.1.22: четыре вкладки — на телефоне переносятся, а не уезжают за край */
      header { position: static; } /* высокая шапка не закрывает полэкрана при прокрутке */ }
  </style>
</head>
<body>
  <header>
    <h1>Духолов · Модерация</h1>
    <nav class="tabs hidden-until-admin"></nav>
    <span class="who"></span>
  </header>
  <main id="app"><p class="muted">Загрузка…</p></main>
  <script src="js/admin.js?v=dev"></script>
</body>
</html>
