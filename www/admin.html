  <link rel="stylesheet" href="vendor/leaflet/leaflet.min.css?v=dev" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb">
  <script src="vendor/leaflet/leaflet.min.js?v=dev" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"></script>

  <style>
    :root { --bg: #120c24; --bg2: #1c1438; --card: #231a45; --line: rgba(255,255,255,.12); --text: #f3f0ff; --muted: #b3aacb; --gold: #fbbf24; --ok: #86efac; --bad: #fca5a5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg2); position: sticky; top: 0; z-index: 2000; }
    header h1 { font-size: 18px; margin: 0; }
    header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 4px; }
    .tabs button { padding: 6px 12px; border-radius: 8px; color: var(--muted); }
    .tabs button.on { background: rgba(255,255,255,.12); color: var(--text); }
    main { padding: 20px; max-width: 1300px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .login { max-width: 420px; margin: 60px auto; }
    .input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); }
    .btn { padding: 9px 16px; border-radius: 10px; background: rgba(255,255,255,.12); font-weight: 600; }
    .btn.primary { background: var(--gold); color: #1c1438; }
    .btn.ok { background: #16a34a; color: #fff; }
    .btn.no { background: #dc2626; color: #fff; }
    .btn:disabled { opacity: .5; cursor: default; }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .queue { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
    .qlist { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 120px); overflow: auto; }
    .qitem { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: left; }
    .qitem.on { border-color: var(--gold); }
    .qitem img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: none; }
    .qitem b { display: block; }
    .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
    .detail img.photo { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; object-fit: contain; }
    .map { height: 320px; border-radius: 12px; overflow: hidden; }
    .bigmap { height: calc(100vh - 110px); border-radius: 16px; overflow: hidden; }
    .checks { list-style: none; padding: 0; margin: 10px 0; }
    .checks li { padding: 4px 0; }
    .checks .ok::before { content: '✓ '; color: var(--ok); font-weight: 700; }
    .checks .bad::before { content: '✗ '; color: var(--bad); font-weight: 700; }
    .checks .warn::before { content: '! '; color: var(--gold); font-weight: 700; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    label.f { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .st-approved { color: var(--ok); } .st-rejected { color: var(--bad); }
    .pin-me { stroke: #fff; fill: #38bdf8; fill-opacity: 1; }
    .pin-obj { stroke: #92400e; fill: var(--gold); fill-opacity: 1; }
    .pin-poi { stroke: #0f766e; fill: #5eead4; fill-opacity: .9; }
    .pin-shrine { stroke: #7c2d12; fill: #fb923c; fill-opacity: .9; }
    .pin-off { stroke: #555; fill: #999; fill-opacity: .6; }
    .pin-player { stroke: #fff; stroke-width: 2; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--card); color: var(--text); }
    .leaflet-popup-content .input { margin: 4px 0; }
    @media (max-width: 900px) { .queue, .detail { grid-template-columns: 1fr; } .qlist { max-height: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Духолов · Модерация</h1>
    <nav class="tabs hidden-until-admin"></nav>
    <span class="who"></span>

  <main id="app"><p class="muted">Загрузка…</p></main>
  <script src="js/admin.js?v=dev"></script>
</body>
</html>
