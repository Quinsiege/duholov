  <!-- 3.31.1: экран загрузки рисуется сразу — его стили здесь, а таблицы стилей игры подключаются в body после него -->
  <style>
    :root { --bg: #120c24; --text: #f4f1ff; --muted: #b3aacb; --line: rgba(255, 255, 255, .12); --gold: #fbbf24; --gold2: #fde047; --teal: #5eead4;
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; }
    .loader { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; box-sizing: border-box;
      padding: calc(30px + var(--st)) 24px calc(30px + var(--sb)); background: radial-gradient(120% 70% at 50% 0%, #3b1d7a 0%, #160d30 55%, #0a0616 100%);
      text-align: center; transition: opacity .45s; user-select: none; -webkit-user-select: none; }
    .loader.out { opacity: 0; pointer-events: none; }
    .ld-logo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .ld-charm { width: 96px; height: 96px; filter: drop-shadow(0 0 24px rgba(253, 224, 71, .5)); animation: ldFloat 3s ease-in-out infinite; }
    .ld-charm svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ld-logo h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #fffbeb, var(--gold2) 55%, #f59e0b);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes ldFloat { 50% { transform: translateY(-6px) rotate(4deg); } }
    .ld-prog { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
    .ld-bar { height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .1); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .4); }
    .ld-bar i { display: block; height: 100%; width: 0; border-radius: 5px; transition: width .35s ease-out; position: relative; overflow: hidden;
      background: linear-gradient(90deg, var(--teal), var(--gold2)); box-shadow: 0 0 10px rgba(253, 224, 71, .45); }
    .ld-bar i.boot { animation: ldBoot 12s cubic-bezier(.1, .7, .3, 1) forwards; } /* пока грузится код игры — ползёт сам */
    @keyframes ldBoot { from { width: 3%; } to { width: 11%; } }
    .ld-bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: ldShine 1.4s linear infinite; }
    @keyframes ldShine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .ld-text { font-size: 13px; color: var(--muted); min-height: 18px; }
    .ld-hint { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 380px; }
    .ld-tip { flex: 1; min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px 16px; border-radius: 18px;
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); }
    .ld-tip small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold2); }
    .ld-tip p { margin: 0; font-size: 14px; line-height: 1.45; }
    .ld-tip p.in { animation: ldIn .35s ease-out; }
    @keyframes ldIn { from { opacity: 0; transform: translateY(6px); } }
    .ld-arrow { width: 36px; height: 36px; flex: none; padding: 0; border-radius: 50%; font: inherit; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer;
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line); -webkit-tap-highlight-color: transparent; }
    .ld-arrow:active { transform: scale(.92); color: var(--text); }
    .ld-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 260px; min-height: 6px; }
    .ld-dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .2); cursor: pointer; transition: width .2s, background .2s; }
    .ld-dots i.on { width: 16px; background: var(--gold); }
    /* 3.33: логотип — по центру, всё, чего касаются пальцы (совет, стрелки, прогресс), — внизу */
    .loader { justify-content: space-between; gap: 0; padding: calc(24px + var(--st)) 20px calc(26px + var(--sb)); }
    .ld-logo { flex: 1; justify-content: center; gap: 10px; }
    .ld-charm { width: 112px; height: 112px; }
    .ld-logo h1 { font-size: 48px; filter: drop-shadow(0 4px 16px rgba(251, 191, 36, .35)); }
    .ld-logo p { margin: 0; font-size: 14px; color: var(--muted); }
    .ld-foot { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
    .ld-hint { position: relative; max-width: none; }
    .ld-tip { min-height: 104px; padding: 16px 46px; background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .04));
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .ld-tip p { font-size: 14.5px; }
    .ld-arrow { position: absolute; top: 50%; margin-top: -18px; width: 36px; height: 36px; border: 0; background: transparent; font-size: 28px; }
    .ld-arrow.prev { left: 4px; } .ld-arrow.next { right: 4px; }
    .ld-arrow:active { transform: scale(.88); }
    .ld-dots { align-self: center; }
    .ld-prog { max-width: none; gap: 7px; }
    .ld-row { display: flex; justify-content: space-between; align-items: baseline; }
    .ld-text { min-height: 0; }
    .ld-pct { font-size: 13px; font-weight: 700; color: var(--gold2); font-variant-numeric: tabular-nums; }
    .ld-bar { height: 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .08); }
    .ld-bar i { border-radius: 6px; }
    @media (max-height: 640px) { .ld-charm { width: 80px; height: 80px; } .ld-logo h1 { font-size: 38px; } .ld-tip { min-height: 88px; } }
    .eco .ld-charm, .calm .ld-charm, .calm .ld-bar i::after { animation: none; }
