<body>
  <div id="map"></div>

  <div id="hud">
    <div class="hud-top">
      <button id="profileBtn" class="profile" aria-label="Профиль">
        <div class="avatar"><div class="ava-art"></div><span id="hudLvl">1</span></div>
        <div class="pinfo"><div id="hudName"></div><div class="xpbar"><i id="hudXp"></i></div></div>
      </button>
      <div class="hud-right">
        <div id="gpsChip" class="chip"></div>
        <div class="chip-row"><div id="moonChip" class="chip hidden"></div><div id="wxChip" class="chip hidden"></div></div>
        <div id="eventChip" class="chip event"></div>
        <div id="holChip" class="chip event hol hidden"></div>
        <div id="incenseChip" class="chip incense hidden"></div>
      </div>
    </div>

    <button id="storyPill" class="hidden" aria-label="Летопись"><span class="sp-ico"></span><span class="sp-main"><b class="sp-t"></b><small class="sp-s"></small></span></button>
    <div id="tracker" class="hidden"><div class="tr-arrow"><svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z" fill="currentColor"/></svg></div><div class="tr-ico"></div><div class="tr-main"><b class="tr-name"></b><small class="tr-dist"></small></div><button class="tr-x" aria-label="Перестать следить">×</button></div>

    <button id="recenterBtn" class="btn-round recenter" aria-label="К себе"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button>

    <div id="joystick" class="joystick hidden"><div class="stick"></div></div>

    <button id="questBtn" class="qbtn" aria-label="Задания"><svg class="qring" viewBox="0 0 60 60"><circle class="qr-bg" cx="30" cy="30" r="27"/><circle class="qr-fg" cx="30" cy="30" r="27"/></svg><span class="q-ico"></span><i class="badge hidden"></i></button>

    <button id="menuBtn" class="orb" aria-label="Меню">
      <svg viewBox="0 0 100 100"><defs><radialGradient id="orbG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffbeb"/><stop offset=".45" stop-color="#fde047"/><stop offset="1" stop-color="#a16207"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#orbG)" stroke="#78350f" stroke-width="4"/><circle cx="50" cy="50" r="30" fill="none" stroke="#fffbeb" stroke-width="3" stroke-dasharray="6 5"/><path d="M50 28V72M31 39L69 61M69 39L31 61" stroke="#fffbeb" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="#fffbeb"/></svg>
      <i class="badge hidden"></i>
    </button>

    <button id="nearbyBtn" class="nearby" aria-label="Рядом"><div class="nb-arts"></div><span>Рядом</span></button>
  </div>

  <div id="toasts"></div>
