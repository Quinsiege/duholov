    :root { --bg: #0b0620; --text: #f4f1ff; --muted: #b3aacb; --line: rgba(255, 255, 255, .12); --gold: #fbbf24; --gold2: #fde047; --teal: #5eead4;

    .ld-arrow { position: absolute; top: 50%; z-index: 1; width: 34px; height: 34px; margin: -17px 0 0; padding: 0 0 3px; display: grid; place-items: center; border-radius: 50%;
