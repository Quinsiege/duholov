# Сборка APK и публикация игры на GitHub Pages при каждом push в main.
# Однократно включить: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  apk:
    name: APK для Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Сборка debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: duholov-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  pages:
    name: Сайт игры
    needs: apk
    if: ${{ always() }}   # сайт публикуется, даже если APK не собрался
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Положить APK рядом с сайтом
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: duholov-apk
          path: www
      - run: if [ -f www/app-debug.apk ]; then mv www/app-debug.apk www/duholov.apk; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
