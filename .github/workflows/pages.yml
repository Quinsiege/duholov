# Прод: после слияния Pull Request в main — тесты, сборка APK и публикация на GitHub Pages.
# Сайт выкладывается только если всё зелёное. Pages: Settings → Pages → Source: «GitHub Actions».
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

  apk:
    name: APK для Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: duholov-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  pages:
    name: Сайт игры
    needs: [tests, apk]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duholov-apk
          path: www
      - run: mv www/app-debug.apk www/duholov.apk
      # Метка версии в адресах файлов (?v=dev → ?v=2.1.1): CDN GitHub Pages кэширует файлы на 10 минут,
      # а новые адреса он берёт с сервера — новая страница никогда не получит старые скрипты.
      - name: Метка версии в адресах файлов
        run: |
          V=$(node -p "require('./www/version.json').version")
          sed -i "s/?v=dev/?v=$V/g" www/index.html www/admin.html www/sw.js
          if grep -q '?v=dev' www/index.html www/admin.html www/sw.js; then echo 'осталась метка ?v=dev'; exit 1; fi
          echo "Версия $V"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
