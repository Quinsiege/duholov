# Места по всей России: раз в неделю — свежая выгрузка OpenStreetMap (Geofabrik) → отбор объектов
# для игры (tools/osm-import/build.py) → загрузка в таблицу pois (load.sql).
# Загрузка — на сервер игры (duholov.ru) по SSH: нужен секрет DEPLOY_SSH_KEY (ключ пользователя deploy).
# Без секрета workflow только собирает места и прикладывает CSV к запуску.
# На Pull Request (изменения в tools/osm-import) — проверка на небольшом регионе, без загрузки.
name: Места России

on:
  schedule:
    - cron: '0 1 * * 1' # по понедельникам, 04:00 по Москве
  workflow_dispatch:
  pull_request:
    paths: ['tools/osm-import/**', '.github/workflows/places.yml']

permissions:
  contents: read

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  import:
    name: Импорт мест из OpenStreetMap
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # на проверке PR — небольшой регион и без загрузки в базу
      REGION: ${{ github.event_name == 'pull_request' && 'russia/kaliningrad' || 'russia' }}
      MIN: ${{ github.event_name == 'pull_request' && '1000' || '150000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool postgresql-client
      - name: Выгрузка OpenStreetMap (${{ env.REGION }})
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -o region.osm.pbf "https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          ls -lh region.osm.pbf
      - name: Нужные игре объекты
        run: |
          osmium tags-filter region.osm.pbf --expressions=tools/osm-import/filter.txt -o filtered.osm.pbf --overwrite
          rm region.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq -a type,id --geometry-types=point,linestring,polygon -o objects.geojsonseq --overwrite
          ls -lh filtered.osm.pbf objects.geojsonseq
      - name: Места для игры
        run: python3 tools/osm-import/build.py objects.geojsonseq pois.csv "$MIN"
      - name: Образец
        run: head -n 20 pois.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pois-csv
          path: pois.csv
          retention-days: 14
      # 4.1: база игры — на своём сервере (duholov.ru). Места уходят туда по SSH, загружает их серверный скрипт
      # duholov-load-places (SQL — только load.sql, лежащий на сервере).
      - name: Загрузка в базу игры
        if: github.event_name != 'pull_request' && env.KEY != ''
        env:
          SERVER: 147.45.100.117
          SERVER_KEY: 147.45.100.117 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICge10MuS0gBYz/ZbkMeN15+FwpVl5EZWdzjEEGMqh12
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SERVER_KEY" > ~/.ssh/known_hosts
          scp -q pois.csv deploy@$SERVER:places/pois.csv
          ssh deploy@$SERVER "sudo -n /usr/local/bin/duholov-load-places $MIN"
      - name: Ключ сервера не задан
        if: github.event_name != 'pull_request' && env.KEY == ''
        run: echo "::warning::Секрет DEPLOY_SSH_KEY не задан — места собраны (артефакт pois-csv), но в базу не загружены"
