# Проверки каждого Pull Request: автотесты в Chromium и сборка APK.
# Слить PR в main можно только когда обе проверки зелёные (правило ветки main). Сборка PR выкладывается на test.duholov.ru.
name: Проверки

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # сервер игры (server/functions/game) собирается из тех же модулей, что и игра: он должен быть пересобран
      - name: Сервер игры собран из текущего кода
        shell: pwsh
        run: ./tools/build-server.ps1 -Check
      # 4.1: собранный сервер проверяет Deno (как на сервере игры) — опечатка в общем коде не доедет до выкладки
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Проверка сервера (Deno)
        run: deno check server/functions/game/index.ts
      # 4.3: запросы разных игроков сервер выполняет одновременно — у каждого должен остаться свой прогресс
      - name: Одновременные запросы (Deno)
        run: |
          n=$(grep -n "Edge Function: вход, загрузка и сохранение" server/functions/game/index.ts | cut -d: -f1)
          { head -n $((n-1)) server/functions/game/index.ts; cat tests/concurrency.harness.js; } > "$RUNNER_TEMP/ct.ts"
          deno run --allow-all "$RUNNER_TEMP/ct.ts"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Браузер для тестов (кэш)
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
      - name: Установка Playwright
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          if [ '${{ steps.pw.outputs.cache-hit }}' = 'true' ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Тесты
        working-directory: tests
        run: npm test
      # та же игра, собранная для выкладки (один файл кода), — должна запускаться так же
      - name: Тесты собранной версии
        run: |
          npm ci --prefix tools/web --no-audit --no-fund
          node tools/web/build.mjs
          cd tests && npm test

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android assembleDebug --no-daemon

  # Сборка Pull Request на test.duholov.ru и его функция game — в тестовый контур (api-test.duholov.ru): проверить с телефона до слияния
  test-site:
    name: Тестовый сайт
    needs: [tests]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SERVER: 147.45.100.117
      SERVER_KEY: 147.45.100.117 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICge10MuS0gBYz/ZbkMeN15+FwpVl5EZWdzjEEGMqh12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      # 4.2: 45 своих скриптов — в один сжатый js/app.min.js, style.css — сжатый (tools/web/build.mjs)
      - name: Сборка сайта
        run: npm ci --prefix tools/web --no-audit --no-fund && node tools/web/build.mjs
      - name: Метка версии в адресах файлов
        run: sh tools/stamp-version.sh
      - name: Выкладка на test.duholov.ru
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SERVER_KEY" > ~/.ssh/known_hosts
          # функция game тестового контура (api-test.duholov.ru) — из этого же PR, потом сайт
          scp -q server/functions/game/index.ts deploy@$SERVER:/opt/duholov-test/volumes/functions/game/index.ts.new
          ssh deploy@$SERVER 'mv /opt/duholov-test/volumes/functions/game/index.ts.new /opt/duholov-test/volumes/functions/game/index.ts && sudo -n docker restart dt-functions'
          rsync -rlptz --delete --exclude='video/' www/ deploy@$SERVER:/srv/www/test/
          echo "https://test.duholov.ru/ — сборка ${GITHUB_SHA::7}"
