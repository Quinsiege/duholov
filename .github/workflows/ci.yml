# Проверки каждого Pull Request: автотесты в Chromium и сборка APK.
# Слить PR в main можно только когда обе проверки зелёные (правило ветки main).
name: Проверки

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # сервер игры (server/functions/game) собирается из тех же модулей, что и игра: он должен быть пересобран
      - name: Сервер игры собран из текущего кода
        shell: pwsh
        run: ./tools/build-server.ps1 -Check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Тесты
        working-directory: tests
        run: npm test

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android assembleDebug --no-daemon
