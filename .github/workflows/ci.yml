# Проверки каждого Pull Request: автотесты в Chromium и сборка APK.
# Слить PR в main можно только когда обе проверки зелёные (правило ветки main). Сборка PR выкладывается на test.duholov.ru.
name: Проверки

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # сервер игры (server/functions/game) собирается из тех же модулей, что и игра: он должен быть пересобран
      - name: Сервер игры собран из текущего кода
        shell: pwsh
        run: ./tools/build-server.ps1 -Check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Тесты
        working-directory: tests
        run: npm test

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p android assembleDebug --no-daemon

  # Сборка Pull Request на test.duholov.ru (тестовый контур) — проверить с телефона до слияния
  test-site:
    name: Тестовый сайт
    needs: [tests]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SERVER: 147.45.100.117
      SERVER_KEY: 147.45.100.117 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICge10MuS0gBYz/ZbkMeN15+FwpVl5EZWdzjEEGMqh12
    steps:
      - uses: actions/checkout@v4
      - name: Метка версии в адресах файлов
        run: sh tools/stamp-version.sh
      - name: Выкладка на test.duholov.ru
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SERVER_KEY" > ~/.ssh/known_hosts
          rsync -rlptz --delete www/ deploy@$SERVER:/srv/www/test/
          echo "https://test.duholov.ru/ — сборка ${GITHUB_SHA::7}"
